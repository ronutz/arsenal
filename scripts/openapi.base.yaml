# =============================================================================
# openapi.yaml - the ronutz tools API contract
# -----------------------------------------------------------------------------
# A small, stateless HTTP API that exposes the same deterministic computations
# that power the in-browser tools, for automation: scripts, CI pipelines, and
# integrations. It is the programmatic counterpart to the browser tools, not a
# replacement for them.
#
# PRIVACY STANCE (deliberate, and consistent with the rest of the site):
#   - The in-browser tools remain the zero-egress default: what you type there
#     never leaves your device.
#   - This API receives ONLY the input you send it, computes a result, and
#     returns it. It is stateless and logs no request bodies or query values.
#   - If you need guaranteed zero data egress, use the browser tools, or run the
#     open core engine yourself.
#
# Served by the Cloudflare Worker on /api/* (run_worker_first), alongside the
# static site. Grows one operation at a time as the toolbox grows; only live
# tools are documented here (no vaporware endpoints).
#
# HAND-AUTHORED OPERATIONS (2026-10-19, PRIME's rule of 15:47: a tool's API and
# every related document change when the tool changes). Each path below is
# written out field by field and replaces the generic operation that
# scripts/build-openapi.mts would otherwise generate for its slug. Rules:
#   - every request and response field the engine reads or returns is in the
#     schema under components.schemas;
#   - every example carries `x-request`, a request taken from the tool's golden
#     vectors, and `value`, the engine's answer to it; build-openapi re-runs
#     each one and fails the build if the value differs;
#   - when a tool's golden-vector set id changes, scripts/check-api-sync.mjs
#     fails until this file, the tool docs, the recipes, the catalogue and the
#     provenance entry are re-checked and scripts/api-sync.json records the new
#     id. The x-golden-vector-set on each operation is stamped from that record.
# =============================================================================

openapi: 3.1.0

info:
  title: ronutz tools API
  version: 1.2.0
  summary: Deterministic network and security computations over HTTP.
  description: |
    The programmatic counterpart to the in-browser tools at ronutz.com.

    Every operation here is a pure function: the same input always yields the
    same output, nothing is stored, and no request bodies or query values are
    logged. The browser tools remain the zero-egress default for sensitive work;
    this API exists for automation (scripts, pipelines, integrations).

    The surface grows with the toolbox: every shipped tool is exposed here and
    documented from the same registry, so the served endpoints and this document
    cannot drift apart. Only shipped tools are listed (no vaporware). Each
    operation accepts its input via GET (?input=) or POST (the request body) and
    returns a JSON result.

    Operations whose request and response are written out field by field carry
    examples whose requests come from the tool's golden vectors; the build re-runs
    every one of them through the engine and fails if a documented value differs.
    Every operation carries `x-golden-vector-set`, the id of the golden-vector set
    its contract was last checked against.
  contact:
    name: ronutz
    url: https://ronutz.com/contact
  license:
    name: Apache-2.0 (code), CC-BY-4.0 (content)
    url: https://ronutz.com/colophon

servers:
  - url: https://ronutz.com/api/v1
    description: Production edge (Cloudflare Worker, stateless, no request logging)

tags:
  - name: Networking & addressing
    description: IP addressing and subnet computations.

paths:
  /rpki-origin-validation:
    # Hand-authored 2026-10-19 with the tool (route origin validation calculator); examples from its golden vectors.
    get:
      tags: [Networking & addressing]
      operationId: run_rpki_origin_validation
      summary: Route origin validation calculator
      description: &rovDescription |
        The RFC 6811 section 2 validation state of one route against the VRPs (Validated ROA Payloads) you send:
        Valid when at least one VRP matches, Invalid when at least one covers and none matches, NotFound when none covers.
        Nothing is fetched: there is no RPKI repository or validator behind the operation, so the answer holds for the
        VRPs in the request and no others.

        `route` is a prefix and its origin AS, such as `192.0.2.0/24 AS64496` (asplain or asdot, RFC 5396), or `NONE`
        for the origin value RFC 6811 defines; an origin of AS 0 is refused (RFC 7607 section 2). `vrps` is text with one
        VRP per line (prefix, optional maxLength, AS; `prefix-maxLength` also accepted; `#` starts a comment), or an RFC
        8416 SLURM document as text or as a JSON value, whose prefixAssertions are read as the VRPs and whose
        prefixFilters are counted, not applied. Without a maxLength a VRP authorises the exact prefix only (RFC 9582
        section 4.3.2.2).

        Each VRP comes back with `covers` and a `relation`: `match`, `wrong-as`, `too-specific`,
        `wrong-as-and-too-specific`, `as0` (an AS 0 VRP never matches, RFC 6811 section 2 and RFC 6483 section 4),
        `origin-none`, `not-covering` or `other-family`. `maxLengthNotes` lists every VRP (AS 0 aside) whose maxLength
        is longer than its prefix, with the number of prefixes it authorises, the case RFC 9319 section 5 asks
        operators to avoid.
      externalDocs:
        description: "Tool documentation: Route origin validation calculator"
        url: https://ronutz.com/en/tools/rpki-origin-validation/docs
      parameters:
        - name: input
          in: query
          required: true
          description: The request object as a URL-encoded JSON string.
          schema:
            type: string
            examples: ['{"route":"192.0.2.0/24 AS64497","vrps":"192.0.2.0/24 AS64496\n192.0.2.0/24 AS64497"}']
      responses: &rovResponses
        '200':
          description: The validation state and the reasoning, VRP by VRP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpkiOriginValidationResult'
              examples:
                oneMatchWins:
                  summary: 'Two VRPs cover, one matches: Valid (golden vector rfc6811-one-match-wins, RFC 6811 section 2)'
                  x-request: '{"route":"192.0.2.0/24 AS64497","vrps":"192.0.2.0/24 AS64496\n192.0.2.0/24 AS64497"}'
                  value:
                    route:
                      prefix: 192.0.2.0/24
                      family: ipv4
                      length: 24
                      origin: 64497
                      originAsdot: '64497'
                    state: Valid
                    vrpFormat: text
                    vrpCount: 2
                    covering: 2
                    matching: 1
                    vrps:
                    - index: 1
                      line: 1
                      prefix: 192.0.2.0/24
                      length: 24
                      maxLength: 24
                      maxLengthGiven: false
                      asn: 64496
                      covers: true
                      relation: wrong-as
                    - index: 2
                      line: 2
                      prefix: 192.0.2.0/24
                      length: 24
                      maxLength: 24
                      maxLengthGiven: false
                      asn: 64497
                      covers: true
                      relation: match
                      viaMaxLength: false
                    maxLengthNotes: []
                    notes: []
                    duplicatesRemoved: 0
                    slurmFiltersIgnored: 0
                maxLengthRange:
                  summary: 'RFC 9582''s maxLength example, a /26 inside 203.0.113.0/24 maxLength 26 (golden vector rfc9582-range-26)'
                  x-request: '{"route":"203.0.113.192/26 AS64496","vrps":"203.0.113.0/24 26 AS64496"}'
                  value:
                    route:
                      prefix: 203.0.113.192/26
                      family: ipv4
                      length: 26
                      origin: 64496
                      originAsdot: '64496'
                    state: Valid
                    vrpFormat: text
                    vrpCount: 1
                    covering: 1
                    matching: 1
                    vrps:
                    - index: 1
                      line: 1
                      prefix: 203.0.113.0/24
                      length: 24
                      maxLength: 26
                      maxLengthGiven: true
                      asn: 64496
                      covers: true
                      relation: match
                      viaMaxLength: true
                    maxLengthNotes:
                    - index: 1
                      prefix: 203.0.113.0/24
                      length: 24
                      maxLength: 26
                      asn: 64496
                      authorisedPrefixes: '7'
                      coversRoute: true
                    notes:
                    - valid-via-maxlength
                    duplicatesRemoved: 0
                    slurmFiltersIgnored: 0
                as0Only:
                  summary: 'Only an AS 0 VRP covers: Invalid (golden vector as0-only, RFC 6811 section 2 and RFC 6483 section 4)'
                  x-request: '{"route":"203.0.113.0/24 AS64496","vrps":"203.0.113.0/24 32 AS0"}'
                  value:
                    route:
                      prefix: 203.0.113.0/24
                      family: ipv4
                      length: 24
                      origin: 64496
                      originAsdot: '64496'
                    state: Invalid
                    vrpFormat: text
                    vrpCount: 1
                    covering: 1
                    matching: 0
                    vrps:
                    - index: 1
                      line: 1
                      prefix: 203.0.113.0/24
                      length: 24
                      maxLength: 32
                      maxLengthGiven: true
                      asn: 0
                      covers: true
                      relation: as0
                    maxLengthNotes: []
                    notes:
                    - as0-only
                    duplicatesRemoved: 0
                    slurmFiltersIgnored: 0
        '400':
          description: >
            A request that is not the { route, vrps } object, a route or VRP that does not parse, a prefix with bits set
            beyond its length, an origin of AS 0, an AS number beyond four octets, a maxLength outside the prefix length
            to 32 or 128, a SLURM document with another slurmVersion or an undefined member, or more than 20000 VRPs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                originAs0:
                  summary: 'A route whose origin is AS 0 is malformed (reject vector route-origin-as0, RFC 7607 section 2)'
                  x-request: '{"route":"192.0.2.0/24 AS0","vrps":"192.0.2.0/24 24 AS64496"}'
                  value:
                    error: invalid_input
                    message: 'a Route with origin AS 0 is malformed and is never validated: RFC 7607 section 2 says a BGP speaker MUST NOT originate or propagate it'
                maxLengthShort:
                  summary: 'A maxLength shorter than its prefix (reject vector vrp-maxlength-short, RFC 9582 section 4.3.2.2)'
                  x-request: '{"route":"192.0.2.0/24 AS64496","vrps":"192.0.2.0/24 23 AS64496"}'
                  value:
                    error: invalid_input
                    message: maxLength 23 must be between the prefix length /24 and 32 (RFC 9582 section 4.3.2.2)
    post:
      tags: [Networking & addressing]
      operationId: run_rpki_origin_validation_post
      summary: Route origin validation calculator (POST)
      description: *rovDescription
      requestBody:
        required: true
        description: The request object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpkiOriginValidationRequest'
      responses: *rovResponses

  /bfd-timers:
    get:
      tags: [Networking]
      operationId: run_bfd_timers
      summary: BFD timer calculator
      description: &bfdDescription |
        Two modes, chosen by `mode`. Without it (or with `"timers"`), the request gives both systems' Desired Min TX
        Interval, Required Min RX Interval and Detect Mult, optionally their Required Min Echo RX Interval and Demand
        mode, plus the session state (`sessionUp`, default true) and the path (`single-hop`, the default, or
        `multihop`). The answer gives, for each direction (A to B, then B to A), the agreed transmit interval, the
        larger of the sender's Desired Min TX and the receiver's Required Min RX (RFC 5880 sections 6.8.2 and 6.8.7); the
        jitter range (0 to 25% shorter, 10 to 25% when the sender's Detect Mult is 1, section 6.8.7); the packet rate;
        the detection time the receiver computes (the sender's Detect Mult times the agreed interval in Asynchronous
        mode; in Demand mode the receiver's own Detect Mult times its own agreed transmit interval, section 6.8.4);
        RFC 7419 Common Interval membership; and whether Echo packets may flow (section 6.8.9, never over multiple
        hops, RFC 5883 section 3). While the session is not Up every Desired Min TX is raised to 1 s (section 6.8.3).
        Every number comes with explanations, each carrying the section it comes from.

        Intervals are strings with a unit (`us`, `µs`, `ms` or `s`, such as `"300ms"`) or integers in microseconds.
        Warnings name a Required Min RX of 0 and any value below a floor that a downloaded vendor document states
        (FRRouting bfdd: 10 ms; Junos OS 13.1, 2013: 1 ms).

        With `"mode": "decode"`, `packet` is a BFD Control packet in hex (24 to 255 bytes; spaces, colons, hyphens,
        dots and a leading 0x allowed); the answer reads every field of RFC 5880 section 4.1, names the first receive
        check of section 6.8.6 that discards the packet (`discardedBy`, or null), and lists other findings.
        Authentication data is never echoed back: only Auth Type and Auth Len.
      externalDocs:
        description: "Tool documentation: BFD timer calculator"
        url: https://ronutz.com/en/tools/bfd-timers/docs
      parameters:
        - name: input
          in: query
          required: true
          description: The request object as a URL-encoded JSON string.
          schema:
            type: string
            examples: ['{"a":{"desiredMinTx":"300ms","requiredMinRx":"300ms","detectMult":3},"b":{"desiredMinTx":"300ms","requiredMinRx":"200ms","detectMult":3}}']
      responses: &bfdResponses
        '200':
          description: The two directions of the session, or the decoded packet.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BfdTimersResult'
                  - $ref: '#/components/schemas/BfdDecodeResult'
              examples:
                frrExample:
                  summary: FRRouting's detect-multiplier example, 900 ms at the remote system (golden vector frr-detect-multiplier-example)
                  x-request: '{"a":{"desiredMinTx":"300ms","requiredMinRx":"300ms","detectMult":3},"b":{"desiredMinTx":"300ms","requiredMinRx":"200ms","detectMult":3}}'
                  value:
                    mode: timers
                    sessionUp: true
                    path: single-hop
                    systems:
                      a:
                        name: A
                        desiredMinTxUs: 300000
                        advertisedMinTxUs: 300000
                        requiredMinRxUs: 300000
                        detectMult: 3
                        requiredMinEchoRxUs: 0
                        demandRequested: false
                        demandActive: false
                      b:
                        name: B
                        desiredMinTxUs: 300000
                        advertisedMinTxUs: 300000
                        requiredMinRxUs: 200000
                        detectMult: 3
                        requiredMinEchoRxUs: 0
                        demandRequested: false
                        demandActive: false
                    directions:
                      - from: A
                        to: B
                        periodic: true
                        silentReason: null
                        intervalUs: 300000
                        setBy: sender
                        jitter:
                          minUs: 225000
                          maxUs: 300000
                          averageUs: 262500
                          rule: standard
                        packetsPerSecond: 3.333
                        detection:
                          kind: asynchronous
                          detectMult: 3
                          intervalUs: 300000
                          timeUs: 900000
                        commonInterval: false
                        nextCommonIntervalUs: 1000000
                        echo:
                          allowed: false
                          reason: receiver-zero
                          minIntervalUs: null
                          jitterMinUs: null
                        explanations:
                          - id: interval-sender
                            section: RFC 5880 sections 6.8.2 and 6.8.7
                            params:
                              from: A
                              to: B
                              txUs: 300000
                              rxUs: 200000
                              intervalUs: 300000
                            text: >-
                              A may not send Control packets to B faster than the larger of its own Desired Min TX (300 ms) and B's Required
                              Min RX (200 ms): 300 ms. A, the slower side, sets the rate.
                          - id: jitter
                            section: RFC 5880 section 6.8.7
                            params:
                              from: A
                              minUs: 225000
                              maxUs: 300000
                              averageUs: 262500
                            text: >-
                              A shortens each interval by a random 0 to 25% to avoid self-synchronisation, so its packets leave every 225 ms
                              to 300 ms, about 262.5 ms on average (roughly 12.5% less than the agreed interval).
                          - id: rate
                            section: 'computed: 1 s divided by the agreed interval'
                            params:
                              packetsPerSecond: 3.333
                              intervalUs: 300000
                            text: At 300 ms the rate before jitter is 3.333 per second, a little higher after it.
                          - id: detection-async
                            section: RFC 5880 section 6.8.4
                            params:
                              to: B
                              from: A
                              detectMult: 3
                              intervalUs: 300000
                              timeUs: 900000
                            text: >-
                              B declares the session Down, with diagnostic 1 (Control Detection Time Expired), after 900 ms without a valid
                              packet from A: A's Detect Mult (3), which B receives in every packet, times the agreed interval (300 ms).
                              Roughly, 3 packets in a row must be lost.
                          - id: not-common-interval
                            section: RFC 7419 section 3
                            params:
                              intervalUs: 300000
                              nextUs: 1000000
                            text: >-
                              300 ms is not in RFC 7419's Common Interval set. A hardware implementation that cannot run it adjusts towards
                              a larger interval; the next Common Interval is 1 s.
                          - id: echo-receiver-zero
                            section: RFC 5880 sections 4.1 and 6.8.9
                            params:
                              from: A
                              to: B
                            text: 'B advertises a Required Min Echo RX of 0: it will not loop Echo packets back, so A sends none.'
                      - from: B
                        to: A
                        periodic: true
                        silentReason: null
                        intervalUs: 300000
                        setBy: both
                        jitter:
                          minUs: 225000
                          maxUs: 300000
                          averageUs: 262500
                          rule: standard
                        packetsPerSecond: 3.333
                        detection:
                          kind: asynchronous
                          detectMult: 3
                          intervalUs: 300000
                          timeUs: 900000
                        commonInterval: false
                        nextCommonIntervalUs: 1000000
                        echo:
                          allowed: false
                          reason: receiver-zero
                          minIntervalUs: null
                          jitterMinUs: null
                        explanations:
                          - id: interval-both
                            section: RFC 5880 sections 6.8.2 and 6.8.7
                            params:
                              from: B
                              to: A
                              txUs: 300000
                              rxUs: 300000
                              intervalUs: 300000
                            text: >-
                              B may not send Control packets to A faster than the larger of its own Desired Min TX (300 ms) and A's Required
                              Min RX (300 ms): 300 ms. Both ask for the same interval.
                          - id: jitter
                            section: RFC 5880 section 6.8.7
                            params:
                              from: B
                              minUs: 225000
                              maxUs: 300000
                              averageUs: 262500
                            text: >-
                              B shortens each interval by a random 0 to 25% to avoid self-synchronisation, so its packets leave every 225 ms
                              to 300 ms, about 262.5 ms on average (roughly 12.5% less than the agreed interval).
                          - id: rate
                            section: 'computed: 1 s divided by the agreed interval'
                            params:
                              packetsPerSecond: 3.333
                              intervalUs: 300000
                            text: At 300 ms the rate before jitter is 3.333 per second, a little higher after it.
                          - id: detection-async
                            section: RFC 5880 section 6.8.4
                            params:
                              to: A
                              from: B
                              detectMult: 3
                              intervalUs: 300000
                              timeUs: 900000
                            text: >-
                              A declares the session Down, with diagnostic 1 (Control Detection Time Expired), after 900 ms without a valid
                              packet from B: B's Detect Mult (3), which A receives in every packet, times the agreed interval (300 ms).
                              Roughly, 3 packets in a row must be lost.
                          - id: not-common-interval
                            section: RFC 7419 section 3
                            params:
                              intervalUs: 300000
                              nextUs: 1000000
                            text: >-
                              300 ms is not in RFC 7419's Common Interval set. A hardware implementation that cannot run it adjusts towards
                              a larger interval; the next Common Interval is 1 s.
                          - id: echo-receiver-zero
                            section: RFC 5880 sections 4.1 and 6.8.9
                            params:
                              from: B
                              to: A
                            text: 'A advertises a Required Min Echo RX of 0: it will not loop Echo packets back, so B sends none.'
                    warnings: []
                    notes:
                      - id: ports-single-hop
                        section: RFC 5881 sections 4 and 5
                        params: {}
                        text: >-
                          Single-hop Control packets use UDP destination port 3784 (Echo packets 3785) and, without authentication, a TTL or
                          Hop Limit of 255.
                upPacket:
                  summary: An Up packet at 300 ms, bytes computed from RFC 5880 section 4.1 (golden vector up-300ms)
                  x-request: '{"mode":"decode","packet":"20 c0 03 18 00 00 00 01 00 00 00 02 00 04 93 e0 00 04 93 e0 00 00 00 00"}'
                  value:
                    mode: decode
                    hex: 20c003180000000100000002000493e0000493e000000000
                    bytes: 24
                    version: 1
                    diagnostic:
                      code: 0
                      name: No Diagnostic
                      registry: RFC 5880 section 4.1
                    state:
                      code: 3
                      name: Up
                    flags:
                      poll: false
                      final: false
                      controlPlaneIndependent: false
                      authenticationPresent: false
                      demand: false
                      multipoint: false
                    detectMult: 3
                    length: 24
                    myDiscriminator: 1
                    yourDiscriminator: 2
                    desiredMinTxUs: 300000
                    requiredMinRxUs: 300000
                    requiredMinEchoRxUs: 0
                    auth: null
                    discardedBy: null
                    findings:
                      - id: diag
                        section: RFC 5880 section 4.1
                        params:
                          code: 0
                          name: No Diagnostic
                        text: 'Diagnostic 0: No Diagnostic, the sender''s reason for the last change in its session state.'
                      - id: state-up
                        section: RFC 5880 sections 4.1 and 6.2
                        params:
                          state: Up
                        text: 'State Up: the session is established, as the sender sees it.'
                      - id: c-clear
                        section: RFC 5880 section 4.1
                        params: {}
                        text: 'Control Plane Independent (C) is clear: the sender''s BFD shares fate with its control plane.'
                      - id: echo-zero
                        section: RFC 5880 section 4.1
                        params: {}
                        text: 'Required Min Echo RX Interval is zero: the sender will not loop Echo packets back.'
        '400':
          description: >
            The body is not a JSON object, a field is missing, unknown or of the wrong type, an interval has no unit or
            is not whole microseconds, an interval does not fit 32 bits, Desired Min TX is 0 (reserved), Detect Mult is
            outside 1 to 255, or the packet is not 24 to 255 bytes of hex.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noUnit:
                  summary: An interval without a unit (reject vector interval-without-unit)
                  x-request: '{"a":{"desiredMinTx":"300","requiredMinRx":"300ms","detectMult":3},"b":{"desiredMinTx":"300ms","requiredMinRx":"300ms","detectMult":3}}'
                  value:
                    error: invalid_input
                    message: 'a.desiredMinTx: "300" is not an interval; write a number and a unit (us, ms or s), such as 300ms'
    post:
      tags: [Networking]
      operationId: run_bfd_timers_post
      summary: BFD timer calculator (POST)
      description: *bfdDescription
      requestBody:
        required: true
        description: The request object.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/BfdTimersRequest'
                - $ref: '#/components/schemas/BfdDecodeRequest'
            examples:
              timers:
                summary: FRRouting's detect-multiplier example
                value: {"a":{"desiredMinTx":"300ms","requiredMinRx":"300ms","detectMult":3},"b":{"desiredMinTx":"300ms","requiredMinRx":"200ms","detectMult":3}}
              decode:
                summary: An Up packet at 300 ms
                value: {"mode":"decode","packet":"20 c0 03 18 00 00 00 01 00 00 00 02 00 04 93 e0 00 04 93 e0 00 00 00 00"}
      responses: *bfdResponses

  /cidr:
    get:
      tags: [Networking & addressing]
      operationId: computeCidr
      summary: IPv4 CIDR calculator (subnet, special-purpose classification, VLSM, supernet, overlap / gap)
      description: &cidrDescription |
        The four modes of the CIDR / Subnet Calculator, from the same engine the page runs.

        Subnet (the default): a bare block such as `192.168.1.0/24`, or `{"mode": "subnet", "block": "..."}`.
        Returns the network and last addresses, netmask, wildcard mask, first and last usable host, the address and
        usable-host counts, and `specialPurpose`: the rows of the IANA IPv4 Special-Purpose Address Space registry
        (plus the multicast range 224.0.0.0/4 from the IANA IPv4 Multicast Address Space registry) the block falls
        in or overlaps. A /31 counts two usable hosts (RFC 3021) and a /32 one; for /0 to /30 the network and
        broadcast addresses are not counted as usable (RFC 1122, section 3.2.1.3).

        VLSM: `{"mode": "vlsm", "parent": "...", "requirements": [{"label": "...", "hosts": n}, ...],
        "pointToPoint31": false}`. Each request gets the smallest block of at least hosts + 2 addresses (with
        `pointToPoint31: true`, a request for exactly 2 hosts gets a /31 instead, RFC 3021); requests are placed
        largest block first, each aligned to its own size. A 0-host request is refused (`zeroHosts`); a request no
        block of the parent can hold is listed in `unallocated`. The result states `placement`, whether the parent
        was typed with host bits set (`parentMasked`), and the free space left as CIDR blocks (`freeBlocks`).

        Supernet: `{"mode": "supernet", "prefixes": [...]}` merges the prefixes into the fewest blocks that cover
        exactly the same addresses, and gives the single smallest prefix that covers them all, with the addresses it
        adds.

        Overlap / gap: `{"mode": "overlap", "prefixes": [...], "scope": "..."}` lists every overlapping pair
        (identical, contains, contained; two CIDR blocks are either nested or disjoint) and the gaps: inside the
        scope when one is given, else between the lowest and highest prefix.

        `prefixes` is an array of CIDR strings, or one string of them separated by new lines, commas or spaces
        (at most 1,024). Host bits in any block are masked off.
      externalDocs:
        description: "Tool documentation: CIDR / Subnet Calculator"
        url: https://ronutz.com/en/tools/cidr/docs
      parameters:
        - name: input
          in: query
          required: false
          description: >
            The request: a bare IPv4 CIDR block (Subnet mode), or a JSON object naming a mode (URL-encoded).
            Required unless the legacy `block` parameter is given.
          schema:
            type: string
          examples:
            subnet:
              summary: A bare block, Subnet mode
              value: 192.168.1.0/24
            supernet:
