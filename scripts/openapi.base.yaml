                    teredo:
                      server: 192.0.2.45
                      flags: 0x3c5a (C=0, U=0, G=0)
                      cone: false
                      port: 40000
                      client: 203.0.113.20
                    reverseDns: b.e.e.8.f.f.4.3.f.b.3.6.a.5.c.3.d.2.2.0.0.0.0.c.0.0.0.0.1.0.0.2.ip6.arpa
        '400':
          description: The input is empty (`empty`), not an IPv6 address (`format`), or carries a prefix length above 128 (`prefix`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badPrefix:
                  summary: Prefix length above 128 (reject vector bad-prefix)
                  x-request: 2001:db8::/129
                  value:
                    error: invalid_input
                    message: prefix
    post:
      tags: [Networking & addressing]
      operationId: run_ipv6_post
      summary: IPv6 Toolkit (POST)
      description: *ipv6Description
      requestBody:
        required: true
        description: The address or prefix as text.
        content:
          text/plain:
            schema:
              type: string
              examples: ["2001:db8::/64"]
      responses: *ipv6Responses

  /oui-lookup:
    get:
      tags: [Networking & addressing]
      operationId: run_oui_lookup
      summary: OUI / MAC vendor lookup
      description: &ouiDescription |
        Normalises a MAC address (colon, hyphen, Cisco dot or unseparated; 12 hex digits, 16 for EUI-64) or a bare
        OUI (6 hex digits), looks the OUI up in the embedded IEEE MA-L snapshot, and reads the I/G bit (unicast or
        multicast) and the U/L bit (universally or locally administered).

        `wellKnown` is present when a standard or registry, not the OUI holder, gives the address its meaning: the
        IPv4 multicast mapping 01-00-5E-00-00-00 to 01-00-5E-7F-FF-FF with the 32 groups that share the MAC (RFC 1112
        section 6.4), the IPv6 multicast mapping 33-33 with the group's low 32 bits (RFC 2464 section 7), the VRRP
        virtual router MACs with their VRID (RFC 9568 section 7.3), other named rows of the IANA Ethernet Numbers
        registry, and the IEEE standard group addresses (the IEEE 802.1Q reserved block 01-80-C2-00-00-00 to 0F,
        which bridges do not relay, and the IS-IS and ES-IS addresses).

        The tool does not refuse input with HTTP 400: an input that is not a MAC or an OUI returns HTTP 200 with
        `ok: false` and `error.message`.
      externalDocs:
        description: "Tool documentation: OUI / MAC vendor lookup"
        url: https://ronutz.com/en/tools/oui-lookup/docs
      parameters:
        - name: input
          in: query
          required: true
          description: A MAC address or an OUI, in any of the accepted notations.
          schema:
            type: string
            examples: ["00:00:5E:00:01:01"]
      responses: &ouiResponses
        '200':
          description: The lookup, or `ok:false` with the reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OuiResult'
              examples:
                ipv4Multicast:
                  summary: An IPv4 multicast MAC and its 32 groups (golden vector ipv4-mcast-mapping)
                  x-request: 01:00:5E:00:00:01
                  value:
                    ok: true
                    input: 01:00:5E:00:00:01
                    hex: '01005E000001'
                    formatted: 01:00:5E:00:00:01
                    oui: 01005E
                    ouiFormatted: 01:00:5E
                    multicast: true
                    local: false
                    isOuiOnly: false
                    vendor: null
                    notes:
                      - The I/G bit is set, so this is a multicast (group) address rather than a single interface.
                    wellKnown:
                      kind: ipv4-multicast
                      name: IPv4 multicast (RFC 1112 mapping)
                      standard: RFC 1112 section 6.4; IANA Ethernet Numbers registry
                      ipv4Groups:
                        - 224.0.0.1
                        - 224.128.0.1
                        - 225.0.0.1
                        - 225.128.0.1
                        - 226.0.0.1
                        - 226.128.0.1
                        - 227.0.0.1
                        - 227.128.0.1
                        - 228.0.0.1
                        - 228.128.0.1
                        - 229.0.0.1
                        - 229.128.0.1
                        - 230.0.0.1
                        - 230.128.0.1
                        - 231.0.0.1
                        - 231.128.0.1
                        - 232.0.0.1
                        - 232.128.0.1
                        - 233.0.0.1
                        - 233.128.0.1
                        - 234.0.0.1
                        - 234.128.0.1
                        - 235.0.0.1
                        - 235.128.0.1
                        - 236.0.0.1
                        - 236.128.0.1
                        - 237.0.0.1
                        - 237.128.0.1
                        - 238.0.0.1
                        - 238.128.0.1
                        - 239.0.0.1
                        - 239.128.0.1
                vrrp:
                  summary: A VRRP virtual MAC (golden vector vrrp-ipv4)
                  x-request: 00:00:5E:00:01:01
                  value:
                    ok: true
                    input: 00:00:5E:00:01:01
                    hex: '00005E000101'
                    formatted: 00:00:5E:00:01:01
                    oui: 00005E
                    ouiFormatted: 00:00:5E
                    multicast: false
                    local: false
                    isOuiOnly: false
                    vendor: ICANN, IANA Department
                    notes: []
                    wellKnown:
                      kind: vrrp-ipv4
                      name: VRRP virtual router (IPv4), VRID 1
                      standard: RFC 9568 section 7.3; IANA Ethernet Numbers registry
                      vrid: 1
                bridgeGroup:
                  summary: An IEEE 802.1Q reserved group address (golden vector bridge-group-00)
                  x-request: 01:80:C2:00:00:00
                  value:
                    ok: true
                    input: 01:80:C2:00:00:00
                    hex: 0180C2000000
                    formatted: 01:80:C2:00:00:00
                    oui: 0180C2
                    ouiFormatted: 01:80:C2
                    multicast: true
                    local: false
                    isOuiOnly: false
                    vendor: null
                    notes:
                      - The I/G bit is set, so this is a multicast (group) address rather than a single interface.
                    wellKnown:
                      kind: group-address
                      name: Bridge Group address / Nearest Customer Bridge group address
                      standard: IEEE Std 802.1Q, 802.1X, 802.1AE, 802.1AX (IEEE RA Standards Group MAC public listing)
                      bridgeFiltered: true
                notAMac:
                  summary: 'Not a MAC: ok false, still HTTP 200 (golden vector reject-length)'
                  x-request: '00:11:22:33'
                  value:
                    ok: false
                    input: '00:11:22:33'
                    error:
                      message: A MAC is 12 hex digits (16 for EUI-64) and an OUI is 6; got 8.
        '400':
          description: Only a missing input (the Worker's `missing_input`); the engine itself never refuses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Networking & addressing]
      operationId: run_oui_lookup_post
      summary: OUI / MAC vendor lookup (POST)
      description: *ouiDescription
      requestBody:
        required: true
        description: The MAC address or OUI as text.
        content:
          text/plain:
            schema:
              type: string
              examples: ["00:00:5E:00:01:01"]
      responses: *ouiResponses

  /mtu-mss:
    get:
      tags: [TLS & transport]
      operationId: run_mtu_mss
      summary: MTU / MSS calculator
      description: &mtuDescription |
        One line in: a link IP MTU (68 to 65535) followed by optional tokens. Encapsulations (`gre`, `ipip`, `6in4`,
        `vxlan`, `geneve`, `wireguard` or `wg`, `pppoe`, or `+N` for a custom overhead of 1 to 2000 bytes) and MPLS
        labels (`mpls`, or `mpls2` to `mpls8`) spend bytes inside the link MTU and shrink the inner IP MTU and the TCP
        MSS; 802.1Q tags (`vlan`, `qinq`) sit in the frame header and grow the Ethernet frame instead. `v6` sizes the
        IP-carrying encapsulations with an IPv6 outer header.

        MPLS labels are counted inside the frame payload (RFC 3032 section 3.1, 4 bytes per label stack entry, section
        2.1): `labelTotal` is subtracted from the MTU with `encapTotal`, `shimTotal` counts 802.1Q and QinQ tags only,
        and `underlay.requiredMtu` is 1500 + `encapTotal` + `labelTotal` (one label on a 1500-byte packet needs a
        1504-byte payload, RFC 3032 section 3). `underlay` is present when the stack has at least one encapsulation or
        label.
      externalDocs:
        description: "Tool documentation: MTU / MSS calculator"
        url: https://ronutz.com/en/tools/mtu-mss/docs
      parameters:
        - name: input
          in: query
          required: true
          description: The MTU and the stack, separated by spaces.
          schema:
            type: string
            examples: ["1500 vlan mpls2"]
      responses: &mtuResponses
        '200':
          description: The computed numbers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MtuMssResult'
              examples:
                vlanMpls2:
                  summary: One VLAN tag and two MPLS labels (golden vector vlan-mpls2-1500)
                  x-request: 1500 vlan mpls2
                  value:
                    mtu: 1500
                    outer: ipv4
                    layers:
                      - id: vlan
                        bytes: 4
                        kind: shim
                      - id: mpls
                        bytes: 8
                        kind: label
                    encapTotal: 0
                    labelTotal: 8
                    shimTotal: 4
                    innerMtu: 1492
                    mssV4: 1452
                    mssV6: 1432
                    frame:
                      l2Header: 14
                      shimBytes: 4
                      fcs: 4
                      maxFrame: 1522
                      onWire: 1542
                    efficiency:
                      atMtu:
                        mtu: 1500
                        percent: 94.93
                      ref1500:
                        mtu: 1500
                        percent: 94.93
                      ref9000:
                        mtu: 9000
                        percent: 99.14
                    innerIsV6Only: false
                    hasVariableLayer: false
                    underlay:
                      innerTarget: 1500
                      requiredMtu: 1508
                      requiredFrame: 1530
                vxlan:
                  summary: A VXLAN overlay (golden vector vxlan-1500)
                  x-request: 1500 vxlan
                  value:
                    mtu: 1500
                    outer: ipv4
                    layers:
                      - id: vxlan
                        bytes: 50
                        kind: encap
                    encapTotal: 50
                    labelTotal: 0
                    shimTotal: 0
                    innerMtu: 1450
                    mssV4: 1410
                    mssV6: 1390
                    frame:
                      l2Header: 14
                      shimBytes: 0
                      fcs: 4
                      maxFrame: 1518
                      onWire: 1538
                    efficiency:
                      atMtu:
                        mtu: 1500
                        percent: 94.93
                      ref1500:
                        mtu: 1500
                        percent: 94.93
                      ref9000:
                        mtu: 9000
                        percent: 99.14
                    innerIsV6Only: false
                    hasVariableLayer: false
                    underlay:
                      innerTarget: 1500
                      requiredMtu: 1550
                      requiredFrame: 1568
        '400':
          description: >
            An unrecognised token, an MTU outside 68 to 65535, a custom overhead outside 1 to 2000, an MPLS label count
            outside 1 to 8, a token given twice, or a stack that leaves an inner MTU below 68.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                nineLabels:
                  summary: Nine labels is out of range (reject vector mpls-nine-labels)
                  x-request: 1500 mpls9
                  value:
                    error: invalid_input
                    message: mpls label count must be 1..8
    post:
      tags: [TLS & transport]
      operationId: run_mtu_mss_post
      summary: MTU / MSS calculator (POST)
      description: *mtuDescription
      requestBody:
        required: true
        description: The MTU and the stack as text.
        content:
          text/plain:
            schema:
              type: string
              examples: ["1500 vlan mpls2"]
      responses: *mtuResponses

  /dig-output-explainer:
    get:
      tags: [Networking & addressing]
      operationId: run_dig_output_explainer
      summary: dig output explainer
      description: &digOutDescription |
        Parses the text of a dig answer (BIND 9 dig, the default layout and the +ttlunits, +nottlid and +multiline
        variants) into its version line, header, flags and section counts, EDNS OPT pseudo-section, sections and
        records, footer, and warning codes. Nothing is resolved.

        TTLs are given in seconds. When dig printed a TTL in units (+ttlunits, such as `1h30m` or `1d`) the record
        keeps the printed text in `ttlText` and `ttl` is its value in seconds; a record printed without a TTL
        (+nottlid) has `ttl: null` and the result carries the warning `ttl-absent`. For a negative answer (NXDOMAIN, or
        NOERROR with no answer) with an SOA in AUTHORITY, `negative` gives the negative-caching TTL: the smaller of
        the SOA record's TTL and its MINIMUM field (RFC 2308, section 5). Where dig 9.20 prints a placeholder for an
        opcode or RCODE that has an IANA name, the header adds it: RESERVED6 is `opcodeName: DSO` and RESERVED11 is
        `statusName: DSOTYPENI` (RFC 8490).

        Text that is not dig output is not refused: `hadHeader` is false and the sections are empty.
      externalDocs:
        description: "Tool documentation: dig output explainer"
        url: https://ronutz.com/en/tools/dig-output-explainer/docs
      parameters:
        - name: input
          in: query
          required: true
          description: The dig output, URL-encoded, new lines and tabs included.
          schema:
            type: string
      responses: &digOutResponses
        '200':
          description: The parse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigOutputParse'
              examples:
                nxdomainTtlUnits:
                  summary: NXDOMAIN printed with +ttlunits (golden vector ttlunits-days-negative)
                  x-request: "; <<>> DiG 9.20.29 <<>> @127.0.0.1 -p 5311 nonexistent.invalid A +ttlunits\n; (1 server found)\n;; global options: +cmd\n;; Got answer:\n;; ->>HEADER<<- opcode: QUERY, status: NXDOMAIN, id: 43271\n;; flags: qr rd ra ad; QUERY: 1, ANSWER: 0, AUTHORITY: 1, ADDITIONAL: 1\n\n;; OPT PSEUDOSECTION:\n; EDNS: version: 0, flags:; udp: 1232\n;; QUESTION SECTION:\n;nonexistent.invalid.\t\tIN\tA\n\n;; AUTHORITY SECTION:\n.\t\t\t1d\tIN\tSOA\ta.root-servers.net. nstld.verisign-grs.com. 2026101900 1800 900 604800 86400\n\n;; Query time: 132 msec\n;; SERVER: 127.0.0.1#5311(127.0.0.1) (UDP)\n;; WHEN: Mon Oct 19 14:37:36 -03 2026\n;; MSG SIZE  rcvd: 123"
                  value:
                    sections:
                      - name: QUESTION
                        records:
                          - name: nonexistent.invalid.
                            ttl: null
                            class: IN
                            type: A
                            rdata: ''
                            isQuestion: true
                      - name: AUTHORITY
                        records:
                          - name: .
                            ttl: 86400
                            class: IN
                            type: SOA
                            rdata: a.root-servers.net. nstld.verisign-grs.com. 2026101900 1800 900 604800 86400
                            isQuestion: false
                            ttlText: 1d
                    footer:
                      queryTime: 132 msec
                      server: 127.0.0.1#5311(127.0.0.1) (UDP)
                      when: Mon Oct 19 14:37:36 -03 2026
                      msgSize: '123'
                    warnings:
                      - nonzero-rcode
                      - ttl-units
                    hadHeader: true
                    versionLine: ; <<>> DiG 9.20.29 <<>> @127.0.0.1 -p 5311 nonexistent.invalid A +ttlunits
                    digVersion: 9.20.29
                    queryArgs: '@127.0.0.1 -p 5311 nonexistent.invalid A +ttlunits'
                    header:
                      opcode: QUERY
                      status: NXDOMAIN
                      id: '43271'
                    flags:
                      flags:
                        - qr
                        - rd
                        - ra
                        - ad
                      counts:
                        question: 1
                        answer: 0
                        authority: 1
                        additional: 1
                    opt:
                      version: '0'
                      flags: ''
                      udp: 1232
                      extra: []
                    negative:
                      owner: .
                      soaTtl: 86400
                      minimum: 86400
                      ttl: 86400
                opcodeDso:
                  summary: Opcode 6 printed as RESERVED6 (golden vector opcode-reserved6-dso)
                  x-request: |-
                    ; <<>> DiG 9.20.29 <<>> @127.0.0.1 -p 5312 example.com A +opcode=6
                    ; (1 server found)
                    ;; global options: +cmd
                    ;; Got answer:
                    ;; ->>HEADER<<- opcode: RESERVED6, status: NOTIMP, id: 14380
                    ;; flags: qr rd; QUERY: 0, ANSWER: 0, AUTHORITY: 0, ADDITIONAL: 0
                    ;; WARNING: recursion requested but not available
              
                    ;; WARNING: EDNS query returned status NOTIMP - retry with '+noedns'
              
                    ;; Query time: 96 msec
                    ;; SERVER: 127.0.0.1#5312(127.0.0.1) (UDP)
                    ;; WHEN: Mon Oct 19 14:37:44 -03 2026
                    ;; MSG SIZE  rcvd: 12
                  value:
                    sections: []
                    footer:
                      queryTime: 96 msec
                      server: 127.0.0.1#5312(127.0.0.1) (UDP)
                      when: Mon Oct 19 14:37:44 -03 2026
                      msgSize: '12'
                    warnings:
                      - nonzero-rcode
                    hadHeader: true
                    versionLine: ; <<>> DiG 9.20.29 <<>> @127.0.0.1 -p 5312 example.com A +opcode=6
                    digVersion: 9.20.29
                    queryArgs: '@127.0.0.1 -p 5312 example.com A +opcode=6'
                    header:
                      opcode: RESERVED6
                      status: NOTIMP
                      id: '14380'
                      opcodeName: DSO
                    flags:
                      flags:
                        - qr
                        - rd
                      counts:
                        question: 0
                        answer: 0
                        authority: 0
                        additional: 0
        '400':
          description: Only a missing input (the Worker's `missing_input`); the parser never refuses text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Networking & addressing]
      operationId: run_dig_output_explainer_post
      summary: dig output explainer (POST)
      description: *digOutDescription
      requestBody:
        required: true
        description: The dig output as text.
        content:
          text/plain:
            schema:
              type: string
      responses: *digOutResponses

  /nslookup-output-explainer:
    get:
      tags: [Networking & addressing]
      operationId: run_nslookup_output_explainer
      summary: nslookup output explainer
      description: &nsDescription |
        Parses the text of an nslookup answer into the resolver it used (Server and Address lines), whether the answer
        was marked non-authoritative, every record (with MX, SRV and SOA values broken into labelled fields), the
        failures nslookup printed (`** server can't find NAME: RCODE`), and warning codes. "Non-authoritative answer"
        means the AA bit was clear: the answer came from a resolver, not from a server authoritative for the name
        (RFC 1035 section 4.1.1, RFC 2181 section 6). Nothing is resolved.

        Text that is not nslookup output is not refused: `recognized` is false.
      externalDocs:
        description: "Tool documentation: nslookup output explainer"
        url: https://ronutz.com/en/tools/nslookup-output-explainer/docs
      parameters:
        - name: input
          in: query
          required: true
          description: The nslookup output, URL-encoded, new lines and tabs included.
          schema:
            type: string
      responses: &nsResponses
        '200':
          description: The parse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NslookupParse'
              examples:
                nonAuthoritative:
                  summary: A and AAAA, non-authoritative (golden vector a-aaaa-nonauth)
                  x-request: "Server:\t\t127.0.0.1\nAddress:\t127.0.0.1#5311\n\nNon-authoritative answer:\nName:\texample.com\nAddress: 104.20.23.154\nName:\texample.com\nAddress: 172.66.147.243\nName:\texample.com\nAddress: 2606:4700:10::6814:179a\nName:\texample.com\nAddress: 2606:4700:10::ac42:93f3"
                  value:
                    authority: non-authoritative
                    records:
                      - name: example.com
                        type: A
                        value: 104.20.23.154
                      - name: example.com
                        type: A
                        value: 172.66.147.243
                      - name: example.com
                        type: AAAA
                        value: 2606:4700:10::6814:179a
                      - name: example.com
                        type: AAAA
                        value: 2606:4700:10::ac42:93f3
                    errors: []
                    referralNote: false
                    warnings:
                      - non-authoritative
                    recognized: true
                    server:
                      server: 127.0.0.1
                      address: 127.0.0.1#5311
                nxdomain:
                  summary: A name that does not exist (golden vector nxdomain-invalid)
                  x-request: "Server:\t\t127.0.0.1\nAddress:\t127.0.0.1#5311\n\n** server can't find nonexistent.invalid: NXDOMAIN"
                  value:
                    authority: unknown
                    records: []
                    errors:
                      - name: nonexistent.invalid
                        code: NXDOMAIN
                    referralNote: false
                    warnings:
                      - nxdomain
                    recognized: true
                    server:
                      server: 127.0.0.1
                      address: 127.0.0.1#5311
        '400':
          description: Only a missing input (the Worker's `missing_input`); the parser never refuses text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Networking & addressing]
      operationId: run_nslookup_output_explainer_post
      summary: nslookup output explainer (POST)
      description: *nsDescription
      requestBody:
        required: true
        description: The nslookup output as text.
        content:
          text/plain:
            schema:
              type: string
      responses: *nsResponses

  /dig-command-builder:
    get:
      tags: [Networking & addressing]
      operationId: run_dig_command_builder
      summary: dig command builder
      description: &digCmdDescription |
        From a JSON object describing the lookup, builds one dig command in a canonical order, explains every token
        (`parts[].explain` is a stable id), and derives what the query will carry (`effective`). Findings come from the
        BIND 9 dig manual's stated interactions; an `error` finding stops the build (`ok: false`, empty `command`,
        `effective: null`) and is still HTTP 200. `+bufsize=0` advertises a 0-byte EDNS buffer and is a
        `bufsize-default` warning; only a bare `+bufsize` restores dig's default, which is 1232 bytes in every BIND
        release from 9.18.0 (4096 before, and still in the 9.16 branch's dig). Nothing is run.
      externalDocs:
        description: "Tool documentation: dig command builder"
        url: https://ronutz.com/en/tools/dig-command-builder/docs
      parameters:
        - name: input
          in: query
          required: true
          description: The request object as a URL-encoded JSON string.
          schema:
            type: string
            examples: ['{"name":"example.com","bufsize":"0"}']
      responses: &digCmdResponses
        '200':
          description: The command, its parts, the findings and the effective query; `ok:false` when an error finding stops the build.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigCommandResult'
              examples:
                mxDnssec:
                  summary: The page's example (golden vector example-mx-dnssec)
                  x-request: '{"name":"example.com","server":"192.0.2.53","type":"MX","dnssec":true,"multiline":true}'
                  value:
                    ok: true
                    command: dig @192.0.2.53 example.com MX +dnssec +multiline
                    parts:
                      - text: dig
                        kind: program
                        explain: dig
                      - text: '@192.0.2.53'
                        kind: server
                        explain: server
                      - text: example.com
                        kind: name
                        explain: name
                      - text: MX
                        kind: type
                        explain: type
                      - text: +dnssec
                        kind: queryopt
                        explain: dnssec
                      - text: +multiline
                        kind: queryopt
                        explain: multiline
                    findings: []
                    effective:
                      question:
                        name: example.com
                        type: MX
                        klass: IN
                      servers: given
                      transport: UDP
                      tcpFallback: true
                      port: 53
                      recursionDesired: true
                      iterative: false
                      dnssecOk: true
                      checkingDisabled: false
                      authenticData: true
                      edns: true
                      bufsize: null
                      cookie: true
                      signed: false
                bufsizeZero:
                  summary: '+bufsize=0 advertises 0 bytes: a warning (golden vector bufsize-zero)'
                  x-request: '{"name":"example.com","bufsize":"0"}'
                  value:
                    ok: true
                    command: dig example.com +bufsize=0
                    parts:
                      - text: dig
                        kind: program
                        explain: dig
                      - text: example.com
                        kind: name
                        explain: name
                      - text: +bufsize=0
                        kind: queryopt
                        explain: bufsize
                    findings:
                      - code: bufsize-default
                        severity: warning
                    effective:
                      question:
                        name: example.com
                        type: A
                        klass: IN
                      servers: resolv-conf
                      transport: UDP
                      tcpFallback: true
                      port: 53
                      recursionDesired: true
                      iterative: false
                      dnssecOk: false
                      checkingDisabled: false
                      authenticData: true
                      edns: true
                      bufsize: 0
                      cookie: true
                      signed: false
                ixfrNoSerial:
                  summary: 'IXFR without a serial: ok false, still HTTP 200 (golden vector ixfr-missing-serial)'
                  x-request: '{"name":"example.com","type":"IXFR"}'
                  value:
                    ok: false
                    command: ''
                    parts: []
                    findings:
                      - code: ixfr-needs-serial
                        severity: error
                    effective: null
        '400':
          description: The body is not a JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Networking & addressing]
      operationId: run_dig_command_builder_post
      summary: dig command builder (POST)
      description: *digCmdDescription
      requestBody:
        required: true
        description: The request object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DigCommandRequest'
      responses: *digCmdResponses

  /dhcp-option-43:
    get:
      tags: [Networking]
      operationId: run_dhcp_option_43
      summary: DHCP option 43 generator
      description: &dhcpDescription |
        Builds the option 43 value a vendor's access points expect for the given controller addresses. Four encodings
        live behind the one option number: a binary TLV (Cisco, sub-option 0xf1; UniFi, sub-option 1), an ASCII TLV
        (Ruckus, sub-option 3 or 6, one address; ExtremeWireless, sub-option 1 with the addresses as one text value
        joined by ", ", several allowed), a plain string (Aruba; Extreme Fabric Engine switches), and for FortiAP the
        correction that the option is 138. The result gives the value (`hex` or `text`), a byte-by-byte `breakdown`
        for a hex value, ready-to-paste lines for ISC dhcpd, Cisco IOS, Windows and MikroTik, and note codes.

        Vendor ids: `cisco-wlc`, `ruckus-zonedirector`, `ruckus-smartzone`, `unifi-ip`, `extreme-wireless`,
        `extreme-cloudiq-switch`, `aruba`, `fortiap`.
      externalDocs:
        description: "Tool documentation: DHCP option 43 generator"
        url: https://ronutz.com/en/tools/dhcp-option-43/docs
      parameters:
        - name: input
          in: query
          required: true
          description: The request object as a URL-encoded JSON string.
          schema:
            type: string
            examples: ['{"vendor":"cisco-wlc","addresses":"192.168.10.5 192.168.10.20"}']
      responses: &dhcpResponses
        '200':
          description: The value and how to configure it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DhcpOption43Result'
              examples:
                ciscoTwo:
                  summary: Cisco, two controllers (golden vector, Cisco 97066)
                  x-request: '{"vendor":"cisco-wlc","addresses":"192.168.10.5 192.168.10.20"}'
                  value:
                    vendor:
                      id: cisco-wlc
                      label: Cisco Wireless LAN Controller
                      encoding: hex
                      subOption: 241
                      addressForm: binary
                      multiple: true
                      source:
                        label: 'Cisco: Configure DHCP OPTION 43 for Lightweight Access Points (document 97066)'
                        url: https://www.cisco.com/c/en/us/support/docs/wireless-mobility/wireless-lan-wlan/97066-dhcp-option-43-00.html
                        access_date: '2026-10-19'
                    addresses:
                      - 192.168.10.5
                      - 192.168.10.20
                    option: 43
                    encoding: hex
                    hex: f108c0a80a05c0a80a14
                    breakdown:
                      - bytes: f1
                        meaning: sub-option
                      - bytes: '08'
                        meaning: 'length: four bytes per address'
                      - bytes: c0a80a05
                        meaning: 192.168.10.5
                      - bytes: c0a80a14
                        meaning: 192.168.10.20
                    serverSnippets:
                      - server: isc-dhcp
                        lines:
                          - option vendor-encapsulated-options f1:08:c0:a8:0a:05:c0:a8:0a:14;
                      - server: cisco-ios
                        lines:
                          - option 43 hex f108c0a80a05c0a80a14
                      - server: windows
                        lines:
                          - f108c0a80a05c0a80a14
                      - server: mikrotik
                        lines:
                          - add code=43 value=0xf108c0a80a05c0a80a14
                    notes:
                      - multiple-controllers
                extremeList:
                  summary: >-
                    ExtremeWireless, sub-option 1 with an address list (golden vector, the full value from Extreme's ExtremeCloud IQ
                    Controller Deployment Guide, read 2026-10-18 with HTTP 200)
                  x-request: '{"vendor":"extreme-wireless","addresses":"10.100.2.36, 10.100.2.22"}'
                  value:
                    vendor:
                      id: extreme-wireless
                      label: ExtremeWireless / ExtremeCloud IQ Controller
                      encoding: hex
                      subOption: 1
                      addressForm: ascii-list
                      multiple: true
                      vendorClass: HiPath <AP model> on older APs; the bare model (for example AP410) on newer ones
                      source:
                        label: 'Extreme Networks: Configuring DHCP Option 43 (ExtremeCloud IQ Controller Deployment Guide)'
                        url: https://documentation.extremenetworks.com/XIQC/10.06/DG/GUID-A9F28828-9A51-4923-AE62-A252E4745D73.shtml
                        unreachable: '2026-10-19: HTTP 401 Unauthorized for every documentation.extremenetworks.com URL tried'
                    addresses:
                      - 10.100.2.36
                      - 10.100.2.22
                    option: 43
                    encoding: hex
                    hex: 011831302e3130302e322e33362c2031302e3130302e322e3232
                    breakdown:
                      - bytes: '01'
                        meaning: sub-option
                      - bytes: '18'
                        meaning: 'length: 24 characters, dots, commas and spaces included'
                      - bytes: 31302e3130302e322e33362c2031302e3130302e322e3232
                        meaning: 10.100.2.36, 10.100.2.22, one byte per character
                    serverSnippets:
                      - server: isc-dhcp
                        lines:
                          - >-
                            option vendor-encapsulated-options
                            01:18:31:30:2e:31:30:30:2e:32:2e:33:36:2c:20:31:30:2e:31:30:30:2e:32:2e:32:32;
                      - server: cisco-ios
                        lines:
                          - option 43 hex 011831302e3130302e322e33362c2031302e3130302e322e3232
                      - server: windows
                        lines:
                          - 011831302e3130302e322e33362c2031302e3130302e322e3232
                      - server: mikrotik
                        lines:
                          - add code=43 value=0x011831302e3130302e322e33362c2031302e3130302e322e3232
                    notes:
                      - vendor-class-required
                      - ascii-not-binary
                      - multiple-controllers
                arubaString:
                  summary: Aruba, a plain string (golden vector)
                  x-request: '{"vendor":"aruba","addresses":"10.0.2.15"}'
                  value:
                    vendor:
                      id: aruba
                      label: HPE Aruba mobility controller
                      encoding: string
                      multiple: false
                      vendorClass: ArubaAP
                      source:
                        label: 'HPE Aruba Networking: standard and vendor-specific DHCP options for access points'
                        url: >-
                          https://arubanetworking.hpe.com/techdocs/aos/wifi-design-deploy/network-operations/dhcp-for-aps/option-implementation/uap/
                        unreachable: '2026-10-19: HTTP 403, Access Denied'
                    addresses:
                      - 10.0.2.15
                    option: 43
                    encoding: string
                    text: 10.0.2.15
                    serverSnippets:
                      - server: isc-dhcp
                        lines:
                          - option vendor-encapsulated-options "10.0.2.15";
                      - server: cisco-ios
                        lines:
                          - option 60 ascii "ArubaAP"
                          - option 43 ascii "10.0.2.15"
                    notes:
                      - vendor-class-required
                      - string-not-hex
                fortiap138:
                  summary: FortiAP uses option 138, not 43 (golden vector, Fortinet 540137)
                  x-request: '{"vendor":"fortiap","addresses":"10.10.70.1"}'
                  value:
                    vendor:
                      id: fortiap
                      label: Fortinet FortiAP
                      encoding: other-option
                      useOption: 138
                      multiple: true
                      source:
                        label: 'Fortinet: FortiAP acquires the AC address from DHCP option 138 (factory default)'
                        url: https://docs.fortinet.com/document/fortiap/7.2.5/fortiwifi-and-fortiap-configuration-guide/540137
                        access_date: '2026-10-19'
                    addresses:
                      - 10.10.70.1
                    option: 138
                    encoding: other-option
                    text: 10.10.70.1
                    serverSnippets:
                      - server: isc-dhcp
                        lines:
                          - option capwap-ac-v4 10.10.70.1;
                      - server: cisco-ios
                        lines:
                          - option 138 ip 10.10.70.1
                    notes:
                      - not-option-43
        '400':
          description: >
            No address (`empty`), an unknown vendor id, an address that is not a strict dotted quad (leading zeros are
            refused because some DHCP servers read them as octal), more than one address for a vendor that takes one,
            a value longer than the 255 bytes a DHCP option carries, or a body that is not the JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tooMany:
                  summary: Ruckus SmartZone takes one address (reject vector too-many)
                  x-request: '{"vendor":"ruckus-smartzone","addresses":"10.0.0.1 10.0.0.2"}'
                  value:
                    error: invalid_input
                    message: Ruckus SmartZone / vSZ takes a single controller address in this option
    post:
      tags: [Networking]
      operationId: run_dhcp_option_43_post
      summary: DHCP option 43 generator (POST)
      description: *dhcpDescription
      requestBody:
        required: true
        description: The request object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DhcpOption43Request'
      responses: *dhcpResponses

  /ssrf-url-classifier:
    get:
      tags: [Security & WAF]
      operationId: run_ssrf_url_classifier
      summary: SSRF URL classifier
      description: &ssrfDescription |
        Classifies where a URL would send a server-side request, from the URL string alone: nothing is resolved and
        the request is never issued. The host is read from the raw input, so the inet_aton spellings of an IPv4
        address (decimal, octal, hex, short form) are decoded and reported as obfuscation. Every address is matched,
        most specific row first, against the IANA IPv4 and IPv6 Special-Purpose Address Space registries (read
        2026-10-19), and the row is returned in `specialBlock`; the cloud metadata addresses outrank their covering
        row.

        An IPv6 address that carries an IPv4 address is rated by the address it carries: IPv4-mapped (::ffff:0:0/96),
        the deprecated IPv4-compatible form (::/96, `canonicalIp` in mixed notation), NAT64 under 64:ff9b::/96 or
        64:ff9b:1::/48 (RFC 6052 layouts, `embeddingLayout`), 6to4 (2002::/16), and Teredo (2001::/32, RFC 4380
        section 4: `teredo` gives the server, the client with the XOR undone, the client port and the flags, and the
        more internal of server and client decides). `embeddedIpv4` is the deciding address and
        `embeddedSpecialBlock` its IPv4 registry row. `anycastService` is true when the deciding address is a
        registry anycast service address (PCP, TURN, DNS-SD SRP, 6a44 relay). Dangerous non-HTTP schemes and
        embedded credentials are flagged. `reasons` are explanatory sentences in English.

        An empty input is refused with HTTP 400 (`missing_input` when nothing is sent; `invalid_input`, "Enter a URL
        or host to classify.", for whitespace only).
      externalDocs:
        description: "Tool documentation: SSRF URL classifier"
        url: https://ronutz.com/en/tools/ssrf-url-classifier/docs
      parameters:
        - name: input
          in: query
          required: true
          description: The URL or host, URL-encoded.
          schema:
            type: string
            examples: ["http://2852039166/latest/meta-data/"]
      responses: &ssrfResponses
        '200':
          description: The classification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsrfResult'
              examples:
                decimalMetadata:
                  summary: Decimal-encoded metadata URL, the page's Example (golden vector)
                  x-request: http://2852039166/latest/meta-data/
                  value:
                    input: http://2852039166/latest/meta-data/
                    scheme: http
                    port: null
                    path: /latest/meta-data/
                    hasUserinfo: false
                    schemeFlag: null
                    host: '2852039166'
                    isIp: true
                    ipVersion: 4
                    canonicalIp: 169.254.169.254
                    obfuscated: true
                    obfuscationForm: decimal
                    category: cloud-metadata
                    risk: high
                    reasons:
                      - the host is a decimal encoding of 169.254.169.254 - a common way to hide an internal address from a filter
                      - 169.254.169.254 is a cloud instance-metadata endpoint (IMDS)
                    embedding: null
                    embeddedIpv4: null
                    embeddingLayout: null
                    embeddedSpecialBlock: null
                    teredo: null
                    specialBlock:
                      prefix: 169.254.0.0/16
                      name: Link Local
                      rfc: RFC 3927
                      globallyReachable: false
                    anycastService: false
                teredoLoopback:
                  summary: Teredo address whose client carries loopback (golden vector)
                  x-request: http://[2001:0:808:808:0:feae:80ff:fffe]/
                  value:
                    input: http://[2001:0:808:808:0:feae:80ff:fffe]/
                    scheme: http
                    port: null
                    path: null
                    hasUserinfo: false
                    schemeFlag: null
                    host: 2001:0:808:808:0:feae:80ff:fffe
                    isIp: true
                    ipVersion: 6
                    canonicalIp: 2001:0:808:808:0:feae:80ff:fffe
                    obfuscated: false
                    obfuscationForm: null
                    category: loopback
                    risk: high
                    reasons:
                      - >-
                        a Teredo address (2001::/32, RFC 4380 section 4): bits 32 to 63 carry the server 8.8.8.8, and the last 32 bits
                        carry the client 127.0.0.1 stored XOR 0xFFFFFFFF (client port 337, stored XOR 0xFFFF)
                      - >-
                        rated by the client address 127.0.0.1, the more internal of the two: 127.0.0.0/8 is loopback (the host
                        itself); the IANA IPv4 Special-Purpose Address Space registry lists 127.0.0.0/8 as "Loopback" (RFC 1122,
                        Section 3.2.1.3), not globally reachable
                      - >-
                        RFC 4380 section 4 says global Teredo identifiers "MUST include a global scope unicast IPv4 address"; this one
                        names an internal target, so a filter must reject it
                    embedding: teredo
                    embeddedIpv4: 127.0.0.1
                    embeddingLayout: null
                    specialBlock:
                      prefix: 2001::/32
                      name: TEREDO
                      rfc: RFC 4380; RFC 8190
                      globallyReachable: null
                    embeddedSpecialBlock:
                      prefix: 127.0.0.0/8
                      name: Loopback
                      rfc: RFC 1122, Section 3.2.1.3
                      globallyReachable: false
                    teredo:
                      serverIpv4: 8.8.8.8
                      clientIpv4: 127.0.0.1
                      clientPort: 337
                      flags: 0
                    anycastService: false
                ipv4Compatible:
                  summary: Deprecated IPv4-compatible address carrying loopback (golden vector)
                  x-request: http://[::7f00:1]/
                  value:
                    input: http://[::7f00:1]/
                    scheme: http
                    port: null
                    path: null
                    hasUserinfo: false
                    schemeFlag: null
                    host: ::7f00:1
                    isIp: true
                    ipVersion: 6
                    canonicalIp: ::127.0.0.1
                    obfuscated: false
                    obfuscationForm: null
                    category: loopback
                    risk: high
                    reasons:
                      - an IPv4-compatible IPv6 address (::/96, RFC 4291 section 2.5.5.1) carrying 127.0.0.1 in its low 32 bits
                      - >-
                        127.0.0.0/8 is loopback (the host itself); the IANA IPv4 Special-Purpose Address Space registry lists
                        127.0.0.0/8 as "Loopback" (RFC 1122, Section 3.2.1.3), not globally reachable
                      - >-
                        RFC 4291 section 2.5.5.1 says the IPv4-compatible address "is now deprecated" and that the IPv4 address it
                        carries "must be a globally-unique IPv4 unicast address"; a stack that still accepts the format reaches the
                        carried address, so it is rated by it
                    embedding: ipv4-compatible
                    embeddedIpv4: 127.0.0.1
                    embeddingLayout: null
                    specialBlock: null
                    embeddedSpecialBlock:
                      prefix: 127.0.0.0/8
                      name: Loopback
                      rfc: RFC 1122, Section 3.2.1.3
                      globallyReachable: false
                    teredo: null
                    anycastService: false
                nat64Loopback:
                  summary: NAT64 Well-Known Prefix carrying loopback (golden vector)
                  x-request: http://[64:ff9b::7f00:1]/
                  value:
                    input: http://[64:ff9b::7f00:1]/
                    scheme: http
                    port: null
                    path: null
                    hasUserinfo: false
                    schemeFlag: null
                    host: 64:ff9b::7f00:1
                    isIp: true
                    ipVersion: 6
                    canonicalIp: 64:ff9b::127.0.0.1
                    obfuscated: false
                    obfuscationForm: null
                    category: loopback
                    risk: high
                    reasons:
                      - a NAT64 address under the Well-Known Prefix 64:ff9b::/96 (RFC 6052) carrying 127.0.0.1 in its low 32 bits
                      - >-
                        127.0.0.0/8 is loopback (the host itself); the IANA IPv4 Special-Purpose Address Space registry lists
                        127.0.0.0/8 as "Loopback" (RFC 1122, Section 3.2.1.3), not globally reachable
                      - >-
                        RFC 6052 section 3.1 says the Well-Known Prefix MUST NOT represent non-global IPv4 addresses and translators
                        MUST drop such packets; the address still names that internal target, so a filter must reject it
                    embedding: nat64-wkp
                    embeddedIpv4: 127.0.0.1
                    embeddingLayout: 96
                    specialBlock:
                      prefix: 64:ff9b::/96
                      name: IPv4-IPv6 Translat.
                      rfc: RFC 6052
                      globallyReachable: true
                    embeddedSpecialBlock:
                      prefix: 127.0.0.0/8
                      name: Loopback
                      rfc: RFC 1122, Section 3.2.1.3
                      globallyReachable: false
                    teredo: null
                    anycastService: false
                turnAnycast:
                  summary: TURN anycast 192.0.0.10, globally reachable (golden vector)
                  x-request: http://192.0.0.10/
                  value:
                    input: http://192.0.0.10/
                    scheme: http
                    port: null
                    path: null
                    hasUserinfo: false
                    schemeFlag: null
                    host: 192.0.0.10
                    isIp: true
                    ipVersion: 4
                    canonicalIp: 192.0.0.10
                    obfuscated: false
                    obfuscationForm: null
                    category: public
                    risk: low
                    reasons:
                      - >-
                        192.0.0.10 is a special-purpose anycast service address: the TURN anycast address, answered by the
                        topologically nearest TURN server (RFC 8155); the IANA IPv4 Special-Purpose Address Space registry lists
                        192.0.0.10/32 as "Traversal Using Relays around NAT Anycast" (RFC 8155), globally reachable
                    embedding: null
                    embeddedIpv4: null
                    embeddingLayout: null
                    embeddedSpecialBlock: null
                    teredo: null
                    specialBlock:
                      prefix: 192.0.0.10/32
                      name: Traversal Using Relays around NAT Anycast
                      rfc: RFC 8155
                      globallyReachable: true
                    anycastService: true
                gopher:
                  summary: Dangerous scheme gopher:// to loopback (golden vector)
                  x-request: gopher://127.0.0.1:6379/_INFO
                  value:
                    input: gopher://127.0.0.1:6379/_INFO
                    scheme: gopher
                    port: '6379'
                    path: /_INFO
                    hasUserinfo: false
                    schemeFlag: gopher
                    host: 127.0.0.1
                    isIp: true
                    ipVersion: 4
                    canonicalIp: 127.0.0.1
                    obfuscated: false
                    obfuscationForm: null
                    category: loopback
                    risk: high
                    reasons:
                      - >-
                        127.0.0.0/8 is loopback (the host itself); the IANA IPv4 Special-Purpose Address Space registry lists
                        127.0.0.0/8 as "Loopback" (RFC 1122, Section 3.2.1.3), not globally reachable
                      - >-
                        the gopher:// scheme is a common SSRF escalation vector (it can reach the local filesystem or internal
                        services)
                    embedding: null
                    embeddedIpv4: null
                    embeddingLayout: null
                    embeddedSpecialBlock: null
                    teredo: null
                    specialBlock:
                      prefix: 127.0.0.0/8
                      name: Loopback
                      rfc: RFC 1122, Section 3.2.1.3
                      globallyReachable: false
                    anycastService: false
        '400':
          description: An empty input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Security & WAF]
      operationId: run_ssrf_url_classifier_post
      summary: SSRF URL classifier (POST)
      description: *ssrfDescription
      requestBody:
        required: true
        description: The URL or host as text.
        content:
          text/plain:
            schema:
              type: string
              examples: ["http://2852039166/latest/meta-data/"]
      responses: *ssrfResponses

  # ---- routing-table-explainer (hand-authored 2026-10-19; examples re-run by build-openapi) ----
  /routing-table-explainer:
    get:
      tags:
        - Networking & addressing
      operationId: run_routing_table_explainer
      summary: Routing table explainer
      description: >
        Paste the output of a routing table command and get every route parsed into the same fields, the default routes of
        each table with the one that wins, and, on request, the route a destination would use. Four printouts are
        recognised: Linux iproute2 (`ip route`, `ip route show table all`, `ip -6 route`, `ip -d route`), Linux net-tools
        (`netstat -rn`, `route -n`), BSD and macOS `netstat -rn`, and Windows `route print` (IPv4 and IPv6, Active and
        Persistent Routes). Field meanings follow ip-route(8), ip-rule(8), rtnetlink(7), route(8), netstat(8), FreeBSD
        netstat(1), Apple netstat.1 and Microsoft Learn's route pages, read on 2026-10-19.


        The request is the printout as text (parse only), or a JSON object `{"text": ..., "lookup": ...}` (parse, then
        look the address up). The lookup applies RFC 1812 section 5.2.4.3: basic match, then longest match, then the
        lowest metric among equal lengths. For iproute2 it reads table local, then main, then default (the three default
        rules of ip-rule(8)); other tables are listed in `skipped`. A winning `throw` route continues in the next table.
        On Windows only Active Routes are consulted. A route iproute2 prints without a metric is compared as metric 0 (in
        the capture behind the golden vectors, route -n showed Metric 0 for such a route).


        Nothing is dropped: tokens that are not understood stay in the route's `unparsed`, and lines that are neither a
        route nor known structure are listed in `unparsedLines`. Text that is not a routing table is not refused: `format`
        is `unknown`.
      externalDocs:
        description: 'Tool documentation: Routing table explainer'
        url: https://ronutz.com/en/tools/routing-table-explainer/docs
      parameters:
        - name: input
          in: query
          required: true
          description: The printout, URL-encoded with its new lines, or the JSON object {"text", "lookup"} as a string.
          schema:
            type: string
      responses:
        '200':
          description: The parse, and the lookup when one was asked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingTableResult'
              examples:
                ipRouteLookup:
                  summary: A real ip route show and the lookup 192.0.2.77 (golden vector sandbox-ip-route-show)
                  x-request: >-
                    {"text":"$ ip route show\ndefault via 192.0.2.1 dev eth0 \n192.0.2.0/24 dev eth0 proto kernel scope
                    link src 192.0.2.2 ","lookup":"192.0.2.77"}
                  value:
                    parse:
                      format: iproute2
                      routes:
                        - index: 0
                          line: 2
                          raw: 'default via 192.0.2.1 dev eth0 '
                          section: main
                          family: ipv4
                          destination: default
                          prefix: 0.0.0.0/0
                          prefixLength: 0
                          isDefault: true
                          type: unicast
                          gateway: 192.0.2.1
                          onLink: false
                          interface: eth0
                          metric: null
                          metricText: null
                          protocol: null
                          scope: null
                          src: null
                          flags: []
                          nhFlags: []
                          nexthops: []
                          attributes: []
                          unparsed: []
                          notes: []
                        - index: 1
                          line: 3
                          raw: '192.0.2.0/24 dev eth0 proto kernel scope link src 192.0.2.2 '
                          section: main
                          family: ipv4
                          destination: 192.0.2.0/24
                          prefix: 192.0.2.0/24
                          prefixLength: 24
                          isDefault: false
                          type: unicast
                          gateway: null
                          onLink: true
                          interface: eth0
                          metric: null
                          metricText: null
                          protocol: kernel
                          scope: link
                          src: 192.0.2.2
                          flags: []
                          nhFlags: []
                          nexthops: []
                          attributes: []
                          unparsed: []
