                  x-request: '{"mode":"deterministic","inside":"198.51.100.0/28","outside":"192.0.2.1","dynamicFactor":2,"maxPorts":5040,"reverse":{"address":"192.0.2.1","port":2001,"time":"2026-10-19T14:32:52Z"}}'
