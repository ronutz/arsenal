    post:
      tags:
        - Networking & addressing
      operationId: run_routing_table_explainer_post
      summary: Routing table explainer (POST)
      description: >
        Paste the output of a routing table command and get every route parsed into the same fields, the default routes of
        each table with the one that wins, and, on request, the route a destination would use. Four printouts are
        recognised: Linux iproute2 (`ip route`, `ip route show table all`, `ip -6 route`, `ip -d route`), Linux net-tools
        (`netstat -rn`, `route -n`), BSD and macOS `netstat -rn`, and Windows `route print` (IPv4 and IPv6, Active and
        Persistent Routes). Field meanings follow ip-route(8), ip-rule(8), rtnetlink(7), route(8), netstat(8), FreeBSD
        netstat(1), Apple netstat.1 and Microsoft Learn's route pages, read on 2026-10-19.


        The request is the printout as text (parse only), or a JSON object `{"text": ..., "lookup": ...}` (parse, then
        look the address up). The lookup applies RFC 1812 section 5.2.4.3: basic match, then longest match, then the
        lowest metric among equal lengths. For iproute2 it reads table local, then main, then default (the three default
        rules of ip-rule(8)); other tables are listed in `skipped`. A winning `throw` route continues in the next table.
        On Windows only Active Routes are consulted. A route iproute2 prints without a metric is compared as metric 0 (in
        the capture behind the golden vectors, route -n showed Metric 0 for such a route).


        Nothing is dropped: tokens that are not understood stay in the route's `unparsed`, and lines that are neither a
        route nor known structure are listed in `unparsedLines`. Text that is not a routing table is not refused: `format`
        is `unknown`.
