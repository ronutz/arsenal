components:
  schemas:
    # ---- routing-table-explainer (2026-10-19) ----
    RoutingTableRequest:
      type: object
      description: 'The JSON form of the request: the printout and an optional address to look up.'
      required:
        - text
      properties:
        text:
          type: string
          description: The routing table printout, as pasted.
        lookup:
          type: string
          description: An IPv4 or IPv6 address (no length, no zone) to look up.
          examples:
            - 192.0.2.77
    RoutingTableResult:
      type: object
      required:
        - parse
        - lookup
      properties:
        parse:
          $ref: '#/components/schemas/RoutingTableParse'
        lookup:
          description: The lookup, or null when none was asked.
          oneOf:
            - $ref: '#/components/schemas/RoutingTableLookup'
            - type: 'null'
    RoutingTableParse:
      type: object
      required:
        - format
        - routes
        - interfaces
        - defaults
        - unparsedLines
        - structureLines
        - lineCount
        - warnings
      properties:
        format:
          type: string
          enum:
            - iproute2
            - netstat-linux
            - netstat-bsd
            - windows
            - unknown
          description: The command that printed the text.
        routes:
          type: array
          items:
            $ref: '#/components/schemas/RoutingTableRoute'
          description: Every route, in printed order.
        interfaces:
          type: array
          description: The Windows Interface List (empty for other formats).
          items:
            type: object
            required:
              - index
              - mac
              - description
            properties:
              index:
                type: integer
              mac:
                type: string
                description: As printed; empty for the loopback.
              description:
                type: string
        defaults:
          type: array
          items:
            $ref: '#/components/schemas/RoutingTableDefaultGroup'
          description: The default routes (prefix length 0) of each table or section.
        unparsedLines:
          type: array
          description: Lines that are neither a route nor known structure, kept as pasted.
          items:
            type: object
            required:
              - line
              - text
            properties:
              line:
                type: integer
                description: 1-based line number.
              text:
                type: string
        structureLines:
          type: integer
          description: Headers, rulers, section titles and echoed command lines recognised.
        lineCount:
          type: integer
          description: Lines read (at most 5000).
        warnings:
          type: array
          items:
            type: string
            enum:
              - no-routes
              - truncated
              - line-too-long
              - netstat-linux-ipv6
    RoutingTableRoute:
      type: object
      required:
        - index
        - line
        - raw
        - section
        - family
        - destination
        - prefix
        - prefixLength
        - isDefault
        - type
        - gateway
        - onLink
        - interface
        - metric
        - metricText
        - protocol
        - scope
        - src
        - flags
        - nhFlags
        - nexthops
        - attributes
        - unparsed
        - notes
      properties:
        index:
          type: integer
          description: 0-based position.
        line:
          type: integer
          description: 1-based line number of the route's first line.
        raw:
          type: string
          description: The route's text; continuation lines joined with a new line.
        section:
          type: string
          description: >-
            iproute2: the table (main when no `table` token is printed); Windows: ipv4-active, ipv4-persistent, ipv6-active,
            ipv6-persistent; BSD: inet or inet6; net-tools: main.
        family:
          type:
            - string
            - 'null'
          enum:
            - ipv4
            - ipv6
            - null
        destination:
          type: string
          description: As printed.
        prefix:
          type:
            - string
            - 'null'
          description: address/length, or null when the destination is not an address with a length.
        prefixLength:
          type:
            - integer
            - 'null'
        isDefault:
          type: boolean
          description: Prefix length 0.
        type:
          type: string
          enum:
            - unicast
            - local
            - broadcast
            - multicast
            - throw
            - unreachable
            - prohibit
            - blackhole
            - nat
            - anycast
            - reject
          description: The iproute2 type; reject or blackhole from BSD and net-tools flags; unicast otherwise.
        gateway:
          type:
            - string
            - 'null'
          description: The next hop as printed, or null.
        onLink:
          type: boolean
          description: Delivered directly on the interface (no gateway used).
        interface:
          type:
            - string
            - 'null'
          description: dev, Iface, Netif, the Windows Interface address or the IPv6 If number.
        metric:
          type:
            - integer
            - 'null'
        metricText:
          type:
            - string
            - 'null'
          description: 'The metric as printed when it is not a number (Windows Persistent Routes: Default).'
        protocol:
          type:
            - string
            - 'null'
          description: iproute2 proto.
        scope:
          type:
            - string
            - 'null'
          description: iproute2 scope.
        src:
          type:
            - string
            - 'null'
          description: iproute2 src, the preferred source address.
        flags:
          type: array
          description: netstat flag letters, decoded.
          items:
            type: object
            required:
              - letter
              - id
              - source
            properties:
              letter:
                type: string
              id:
                type:
                  - string
                  - 'null'
                description: RTF_* name (BSD and macOS) or LINUX_* (route(8)); null when no manual lists the letter.
              source:
                type:
                  - string
                  - 'null'
                enum:
                  - freebsd
                  - macos
                  - bsd
                  - linux
                  - null
        nhFlags:
          type: array
          items:
            type: string
          description: iproute2 next-hop flags (onlink, pervasive).
        nexthops:
          type: array
          description: iproute2 multipath hops.
          items:
            type: object
            required:
              - gateway
              - dev
              - weight
              - flags
              - unparsed
            properties:
              gateway:
                type:
                  - string
                  - 'null'
              dev:
                type:
                  - string
                  - 'null'
              weight:
                type:
                  - integer
                  - 'null'
              flags:
                type: array
                items:
                  type: string
              unparsed:
                type: array
                items:
                  type: string
        attributes:
          type: array
          description: >-
            Other documented attributes (pref, mtu, nhid, ...) and extra columns (Refs, Use, Expire, Ref, MSS, Window,
            irtt), as printed.
          items:
            type: object
            required:
              - key
              - value
            properties:
              key:
                type: string
              value:
                type: string
        unparsed:
          type: array
          items:
            type: string
          description: Tokens not understood, in order.
        notes:
          type: array
          items:
            type: string
            enum:
              - host-route-no-length
              - default-family-from-context
              - non-contiguous-mask
              - destination-not-an-address
              - network-without-length
              - gateway-link
              - gateway-mac
    RoutingTableDefaultGroup:
      type: object
      required:
        - section
        - consulted
        - candidates
        - winner
        - reason
      properties:
        section:
          type: string
        consulted:
          type: boolean
          description: Whether a lookup reaches this table or section.
        candidates:
          type: array
          items:
            type: integer
          description: Indices of its default routes.
        winner:
          type:
            - integer
            - 'null'
          description: The index that wins, or null.
        reason:
          type: string
          enum:
            - single
            - lowest-metric
            - equal-metric
            - no-metric
    RoutingTableLookup:
      type: object
      required:
        - destination
        - family
        - stages
        - skipped
        - unusable
        - winner
        - action
        - decidedBy
      properties:
        destination:
          type: string
        family:
          type: string
          enum:
            - ipv4
            - ipv6
        stages:
          type: array
          items:
            $ref: '#/components/schemas/RoutingTableLookupStage'
          description: The tables or sections consulted, in order.
        skipped:
          type: array
          items:
            type: object
            required:
              - section
              - reason
            properties:
              section:
                type: string
              reason:
                type: string
                enum:
                  - policy-rule-only
                  - persistent-store
        unusable:
          type: array
          items:
            type: integer
          description: Same-family routes left out because the destination is not an address with a length.
        winner:
          type:
            - integer
            - 'null'
          description: The route used, or null.
        action:
          type: string
          enum:
            - via
            - on-link
            - multipath
            - local
            - broadcast
            - multicast
            - unreachable
            - blackhole
            - prohibit
            - reject
            - nat
            - anycast
            - tie
            - no-route
        decidedBy:
          type:
            - string
            - 'null'
          enum:
            - only-candidate
            - longest-prefix
            - lowest-metric
            - null
    RoutingTableLookupStage:
      type: object
      required:
        - section
        - candidates
        - longest
        - survivors
        - winner
        - outcome
        - decidedBy
      properties:
        section:
          type: string
        candidates:
          type: array
          items:
            type: integer
          description: 'Basic match: routes whose prefix contains the destination.'
        longest:
          type:
            - integer
            - 'null'
        survivors:
          type: array
          items:
            type: integer
          description: 'Longest match: the candidates of the largest length.'
        winner:
          type:
            - integer
            - 'null'
        outcome:
          type: string
          enum:
            - match
            - no-match
            - throw
            - tie
        decidedBy:
          type:
            - string
            - 'null'
          enum:
            - only-candidate
            - longest-prefix
            - lowest-metric
            - null
    # ---- cgn-port-blocks ------------------------------------------------------
    CgnRequest:
      description: The request of one of the three modes, named by `mode`.
      oneOf:
        - type: object
          title: blocks
          required: [mode, pool, blockSize]
          properties:
            mode: { const: blocks }
            pool: { description: "A prefix, a range A-B, one address, or a count of addresses (1 to 16,777,216).", oneOf: [{ type: string }, { type: integer }], examples: ["192.0.2.0/24"] }
            portRange: { type: string, description: "The usable ports, first-last; default 1024-65535.", examples: ["1024-65535"] }
            blockSize: { type: integer, minimum: 1, description: "Ports per block, at most the usable ports of one address." }
            blocksPerSubscriber: { type: integer, minimum: 1, description: "Blocks one subscriber may hold; default 1." }
            subscribers: { type: integer, minimum: 1, description: "The demand, as a count." }
            inside: { type: string, description: "Or the demand as an inside prefix (its host addresses) or range.", examples: ["100.64.0.0/16"] }
            logFormat: { type: string, enum: [nat444, ds-lite], description: "150-byte or 175-byte per-session messages (RFC 7422 section 1); default nat444." }
        - type: object
          title: deterministic
          required: [mode, inside, outside]
          properties:
            mode: { const: deterministic }
            inside: { type: string, description: "I: a prefix (its host addresses, as RFC 7422 section 2.3 counts a /28 as 14) or a range.", examples: ["198.51.100.0/28"] }
            outside: { type: string, description: "O: one address, a prefix (every address) or a range.", examples: ["192.0.2.1"] }
            reserved: { type: string, description: "R: ports and ranges separated by commas; default 0-1023.", examples: ["0-1023,5004,5060"] }
            compressionRatio: { type: integer, minimum: 1, description: "C; default I / O rounded up. C x O must cover I." }
            dynamicFactor: { type: integer, minimum: 0, description: "D; default 0 (no dynamic pool beyond the division's remainder)." }
            maxPorts: { type: integer, minimum: 1, maximum: 65536, description: "M, the maximum ports per user." }
            lookup: { type: string, description: "Forward lookup: an inside address." }
            reverse:
              type: object
              description: "Reverse lookup: an outside address, a port and, optionally, a UTC time."
              required: [address, port]
              properties:
                address: { type: string }
                port: { type: integer, minimum: 0, maximum: 65535 }
                time: { type: string, description: "UTC to the second, YYYY-MM-DDTHH:MM:SSZ.", examples: ["2026-10-19T14:32:52Z"] }
            configFrom: { type: string, description: "When this configuration took effect (UTC)." }
            configUntil: { type: string, description: "When it stopped (UTC)." }
            recordTime: { type: string, description: "The timestamp for the RFC 7422 section 3 configuration record (UTC)." }
        - type: object
          title: map
          required: [mode, offset, psidLength]
          properties:
            mode: { const: map }
            offset: { type: integer, minimum: 0, maximum: 16, description: "a, the PSID offset; RFC 7597's default is 6." }
            psidLength: { type: integer, minimum: 0, maximum: 16, description: "k, the PSID length; a + k is at most 16." }
            psid: { description: "The PSID, 0 to 2^k - 1: a number, or a string in decimal or 0x hexadecimal.", oneOf: [{ type: integer }, { type: string }], examples: ["0x34"] }
            port: { type: integer, minimum: 0, maximum: 65535, description: "A port whose PSID is wanted." }
    CgnPortRange:
      type: object
      required: [first, last]
      properties:
        first: { type: integer }
        last: { type: integer }
    CgnBlocksResult:
      type: object
      required: [mode, pool, portRange, blockSize, blocksPerSubscriber, portsPerSubscriber, blocksPerAddress, leftoverPortsPerAddress, subscribersPerAddress, leftoverBlocksPerAddress, poolSubscribers, poolPorts, demand, log]
      properties:
        mode: { const: blocks }
        pool:
          type: object
          required: [input, addresses, first, last]
          properties:
            input: { type: string }
            addresses: { type: integer }
            first: { type: [string, "null"], description: "null when the pool was given as a count." }
            last: { type: [string, "null"] }
        portRange:
          type: object
          required: [first, last, ports, systemPortsExcluded]
          properties:
            first: { type: integer }
            last: { type: integer }
            ports: { type: integer, description: "last - first + 1." }
            systemPortsExcluded: { type: boolean, description: "True when the range starts above 1023." }
        blockSize: { type: integer }
        blocksPerSubscriber: { type: integer }
        portsPerSubscriber: { type: integer, description: "blockSize x blocksPerSubscriber, the per-subscriber limit (RFC 6888 REQ-4)." }
        blocksPerAddress: { type: integer, description: "floor(ports / blockSize)." }
        leftoverPortsPerAddress: { type: integer, description: "ports - blocksPerAddress x blockSize." }
        subscribersPerAddress: { type: integer, description: "floor(blocksPerAddress / blocksPerSubscriber): every subscriber's blocks on one address (RFC 6888 REQ-2)." }
        leftoverBlocksPerAddress: { type: integer }
        poolSubscribers: { type: integer, description: "addresses x subscribersPerAddress." }
        poolPorts: { type: integer }
        demand:
          type: [object, "null"]
          description: Present when `subscribers` or `inside` is given.
          required: [subscribers, source, addressesNeeded, fits, spare]
          properties:
            subscribers: { type: integer }
            source: { type: string, enum: [count, inside] }
            addressesNeeded: { type: integer, description: "ceil(subscribers / subscribersPerAddress)." }
            fits: { type: boolean }
            spare: { type: integer, description: "poolSubscribers - subscribers; negative when the pool is too small." }
        log:
          type: object
          description: "Per-session figures from RFC 7422 section 1, divided by the block size as RFC 7768 section 2 says; computed, not measured."
          required: [format, messageBytes, connectionsPerSubscriberDay, perSessionLinesPerSubscriberDay, perSessionBytesPerSubscriberDay, reductionFactor, blockLinesPerSubscriberDay, blockBytesPerSubscriberDay, perSessionBytesPerDayAll, blockBytesPerDayAll]
          properties:
            format: { type: string, enum: [nat444, ds-lite] }
            messageBytes: { type: integer, enum: [150, 175] }
            connectionsPerSubscriberDay: { type: integer, const: 33000 }
            perSessionLinesPerSubscriberDay: { type: integer }
            perSessionBytesPerSubscriberDay: { type: integer }
            reductionFactor: { type: integer, description: "The block size." }
            blockLinesPerSubscriberDay: { type: number, description: "Two decimals." }
            blockBytesPerSubscriberDay: { type: number, description: "Two decimals." }
            perSessionBytesPerDayAll: { type: [integer, "null"] }
            blockBytesPerDayAll: { type: [number, "null"] }
    CgnDeterministicRow:
      type: object
      required: [inside, outside, ranges, ports]
      properties:
        inside: { type: string }
        outside: { type: string }
        ranges: { type: array, items: { $ref: '#/components/schemas/CgnPortRange' }, description: "Split only where a reserved port intervenes." }
        ports: { type: integer }
    CgnDeterministicResult:
      type: object
      required: [mode, algorithm, inside, outside, reserved, candidatePorts, compressionRatio, dynamicFactor, totalRatio, portsPerSubscriber, dynamicPoolPorts, dynamicRanges, unusedSlots, maxPorts, overflowPortsPerUser, overflowUsersAtOnce, maxBelowBlock, dynamicDisabledButLeftover, translationLogging, table, forward, reverse, configRecordBody, configRecord, configRecordMissing]
      properties:
        mode: { const: deterministic }
        algorithm:
          type: object
          required: [id, name]
          properties:
            id: { const: 0 }
            name: { const: sequential }
        inside:
          type: object
          required: [input, addresses, first, last]
          properties: { input: { type: string }, addresses: { type: integer }, first: { type: string }, last: { type: string } }
        outside:
          type: object
          required: [input, addresses, first, last]
          properties: { input: { type: string }, addresses: { type: integer }, first: { type: string }, last: { type: string } }
        reserved:
          type: object
          required: [list, ports, systemPortsReserved]
          properties:
            list: { type: string, description: "R as ranges joined by commas." }
            ports: { type: integer }
            systemPortsReserved: { type: boolean, description: "False when any of 0-1023 is left as a candidate." }
        candidatePorts: { type: integer, description: "65536 - reserved ports." }
        compressionRatio: { type: integer }
        dynamicFactor: { type: integer }
        totalRatio: { type: integer, description: "C + D." }
        portsPerSubscriber: { type: integer, description: "floor(candidatePorts / (C + D))." }
        dynamicPoolPorts: { type: integer, description: "candidatePorts - C x portsPerSubscriber, on each outside address." }
        dynamicRanges: { type: array, items: { $ref: '#/components/schemas/CgnPortRange' } }
        unusedSlots: { type: integer, description: "C x O - I." }
        maxPorts: { type: [integer, "null"] }
        overflowPortsPerUser: { type: [integer, "null"], description: "M - portsPerSubscriber when M is larger." }
        overflowUsersAtOnce: { type: [integer, "null"], description: "floor(dynamicPoolPorts / overflowPortsPerUser)." }
        maxBelowBlock: { type: boolean }
        dynamicDisabledButLeftover: { type: boolean, description: "D = 0 and the division left ports over." }
        translationLogging: { type: string, enum: [none, dynamic-blocks-only] }
        table:
          type: [object, "null"]
          description: Up to 256 inside addresses.
          required: [rows, reservedRanges]
          properties:
            rows: { type: array, items: { $ref: '#/components/schemas/CgnDeterministicRow' } }
            reservedRanges: { type: array, items: { $ref: '#/components/schemas/CgnPortRange' } }
        forward:
          type: [object, "null"]
          required: [inside, status, outside, ranges, ports]
          properties:
            inside: { type: string }
            status: { type: string, enum: [mapped, not-inside] }
            outside: { type: [string, "null"] }
            ranges: { type: array, items: { $ref: '#/components/schemas/CgnPortRange' } }
            ports: { type: integer }
        reverse:
          type: [object, "null"]
          required: [address, port, time, timeInWindow, status, inside, blockRanges]
          properties:
            address: { type: string }
            port: { type: integer }
            time: { type: [string, "null"] }
            timeInWindow: { type: [boolean, "null"], description: "null unless a time and a configuration window are given." }
            status: { type: string, enum: [deterministic, dynamic, reserved, unassigned, not-in-pool] }
            inside: { type: [string, "null"], description: "The inside address, for a deterministic port." }
            blockRanges: { type: array, items: { $ref: '#/components/schemas/CgnPortRange' } }
        configRecordBody: { type: [string, "null"], description: "I:mask:O:mask:D:M:A:R, as in RFC 7422 section 3." }
        configRecord: { type: [string, "null"], description: "The record with its timestamp, when recordTime is given.", examples: ["[Wed Oct 11 14:32:52 2000]:198.51.100.0:28:192.0.2.0:32:2:5040:0:1-1023,5004,5060"] }
        configRecordMissing: { type: array, items: { type: string, enum: [inside-prefix, outside-prefix, maxPorts] } }
    CgnMapResult:
      type: object
      required: [mode, a, k, m, sharingRatio, contiguousPorts, interval, portsPerSet, excludedLow, systemPortsExcluded, minPsidAvoidingSystemPorts, portSet, reverse]
      properties:
        mode: { const: map }
        a: { type: integer }
        k: { type: integer }
        m: { type: integer, description: "16 - a - k." }
        sharingRatio: { type: integer, description: "2^k." }
        contiguousPorts: { type: integer, description: "2^m." }
        interval: { type: integer, description: "2^(16 - a)." }
        portsPerSet: { type: integer, description: "2^(16 - k) - 2^m when a > 0; 2^(16 - k) when a = 0." }
        excludedLow: { oneOf: [{ $ref: '#/components/schemas/CgnPortRange' }, { type: "null" }], description: "The A = 0 block, 0 to 2^(16 - a) - 1, when a > 0." }
        systemPortsExcluded: { type: boolean }
        minPsidAvoidingSystemPorts: { type: [integer, "null"], description: "a = 0 only: ceil(1024 / 2^m) (RFC 7597 Appendix B.1)." }
        portSet:
          type: [object, "null"]
          required: [psid, psidHex, rangeCount, ranges, rangesTruncated, firstRange, lastRange, includesSystemPorts, excludedForPsid]
          properties:
            psid: { type: integer }
            psidHex: { type: string, examples: ["0x34"] }
            rangeCount: { type: integer }
            ranges: { type: array, maxItems: 1024, items: { $ref: '#/components/schemas/CgnPortRange' } }
            rangesTruncated: { type: boolean }
            firstRange: { $ref: '#/components/schemas/CgnPortRange' }
            lastRange: { $ref: '#/components/schemas/CgnPortRange' }
            includesSystemPorts: { type: boolean }
            excludedForPsid: { oneOf: [{ $ref: '#/components/schemas/CgnPortRange' }, { type: "null" }] }
        reverse:
          type: [object, "null"]
          required: [port, excluded, psid, psidHex, aValue, j]
          properties:
            port: { type: integer }
            excluded: { type: boolean, description: "True when A is 0 and a > 0: no CE owns the port." }
            psid: { type: [integer, "null"] }
            psidHex: { type: [string, "null"] }
            aValue: { type: integer }
            j: { type: integer }
    # ---- bfd-timers (2026-10-19) ---------------------------------------------
    BfdInterval:
      description: An interval as a string with a unit (us, µs, ms or s; whole microseconds), or an integer in microseconds.
      oneOf:
        - type: string
          examples: ["300ms", "300000us", "16.7ms", "1s"]
        - type: integer
          minimum: 0
          maximum: 4294967295
    BfdSystemInput:
      type: object
      additionalProperties: false
      required: [desiredMinTx, requiredMinRx, detectMult]
      properties:
        desiredMinTx: { $ref: '#/components/schemas/BfdInterval', description: "Desired Min TX Interval; 0 is reserved and refused." }
        requiredMinRx: { $ref: '#/components/schemas/BfdInterval', description: "Required Min RX Interval; 0 asks for no periodic Control packets." }
        detectMult: { oneOf: [{ type: integer, minimum: 1, maximum: 255 }, { type: string, pattern: '^\s{0,3}\d{1,3}\s{0,3}$' }], description: "Detect Mult, 1 to 255." }
        requiredMinEchoRx: { $ref: '#/components/schemas/BfdInterval', description: "Required Min Echo RX Interval; absent or 0 refuses to loop Echo packets." }
        demand: { type: boolean, description: "Demand mode requested; active only while the session is Up." }
    BfdTimersRequest:
      type: object
      additionalProperties: false
      required: [a, b]
      properties:
        mode: { type: string, const: timers }
        a: { $ref: '#/components/schemas/BfdSystemInput' }
        b: { $ref: '#/components/schemas/BfdSystemInput' }
        sessionUp: { type: boolean, default: true, description: "false for Down, Init or AdminDown: every Desired Min TX is raised to 1 s." }
        path: { type: string, enum: [single-hop, multihop], default: single-hop }
    BfdDecodeRequest:
      type: object
      additionalProperties: false
      required: [mode, packet]
      properties:
        mode: { type: string, const: decode }
        packet: { type: string, maxLength: 1024, description: "24 to 255 bytes of hex." }
    BfdExplanation:
      type: object
      required: [id, section, params, text]
      properties:
        id: { type: string, description: "Stable id, e.g. detection-async." }
        section: { type: string, description: "The document and section, e.g. RFC 5880 section 6.8.4, or computed: <rule>." }
        params: { type: object, additionalProperties: { oneOf: [{ type: string }, { type: number }] }, description: "Keys ending in Us are microseconds." }
        text: { type: string, description: "The statement in English." }
    BfdResolvedSystem:
      type: object
      required: [name, desiredMinTxUs, advertisedMinTxUs, requiredMinRxUs, detectMult, requiredMinEchoRxUs, demandRequested, demandActive]
      properties:
        name: { type: string, enum: [A, B] }
        desiredMinTxUs: { type: integer }
        advertisedMinTxUs: { type: integer, description: "At least 1000000 while the session is not Up (RFC 5880 section 6.8.3)." }
        requiredMinRxUs: { type: integer }
        detectMult: { type: integer }
        requiredMinEchoRxUs: { type: integer }
        demandRequested: { type: boolean }
        demandActive: { type: boolean }
    BfdDirection:
      type: object
      required: [from, to, periodic, silentReason, intervalUs, setBy, jitter, packetsPerSecond, detection, commonInterval, nextCommonIntervalUs, echo, explanations]
      properties:
        from: { type: string, enum: [A, B] }
        to: { type: string, enum: [A, B], description: "The receiver, which computes the detection time." }
        periodic: { type: boolean }
        silentReason: { type: [string, "null"], enum: [rx-zero, demand, null] }
        intervalUs: { type: integer, description: "max(sender advertised Desired Min TX, receiver Required Min RX)." }
        setBy: { type: string, enum: [sender, receiver, both] }
        jitter:
          type: object
          required: [minUs, maxUs, averageUs, rule]
          properties:
            minUs: { type: number }
            maxUs: { type: number }
            averageUs: { type: [number, "null"] }
            rule: { type: string, enum: [standard, detect-mult-1] }
        packetsPerSecond: { type: number, description: "1 s divided by the agreed interval, 3 decimals, before jitter." }
        detection:
          type: [object, "null"]
          required: [kind, detectMult, intervalUs, timeUs]
          properties:
            kind: { type: string, enum: [asynchronous, demand] }
            detectMult: { type: integer }
            intervalUs: { type: integer }
            timeUs: { type: integer }
        commonInterval: { type: boolean }
        nextCommonIntervalUs: { type: [integer, "null"] }
        echo:
          type: object
          required: [allowed, reason, minIntervalUs, jitterMinUs]
          properties:
            allowed: { type: boolean }
            reason: { type: [string, "null"], enum: [session-not-up, receiver-zero, multihop, null] }
            minIntervalUs: { type: [integer, "null"] }
            jitterMinUs: { type: [number, "null"] }
        explanations: { type: array, items: { $ref: '#/components/schemas/BfdExplanation' } }
    BfdTimersResult:
      type: object
      required: [mode, sessionUp, path, systems, directions, warnings, notes]
      properties:
        mode: { type: string, const: timers }
        sessionUp: { type: boolean }
        path: { type: string, enum: [single-hop, multihop] }
        systems:
          type: object
          required: [a, b]
          properties:
            a: { $ref: '#/components/schemas/BfdResolvedSystem' }
            b: { $ref: '#/components/schemas/BfdResolvedSystem' }
        directions: { type: array, minItems: 2, maxItems: 2, items: { $ref: '#/components/schemas/BfdDirection' }, description: "A to B, then B to A." }
        warnings: { type: array, items: { $ref: '#/components/schemas/BfdExplanation' } }
        notes: { type: array, items: { $ref: '#/components/schemas/BfdExplanation' } }
    BfdDecodeResult:
      type: object
      required: [mode, hex, bytes, version, diagnostic, state, flags, detectMult, length, myDiscriminator, yourDiscriminator, desiredMinTxUs, requiredMinRxUs, requiredMinEchoRxUs, auth, discardedBy, findings]
      properties:
        mode: { type: string, const: decode }
        hex: { type: string }
        bytes: { type: integer }
        version: { type: integer }
        diagnostic:
          type: object
          required: [code, name, registry]
          properties:
            code: { type: integer }
            name: { type: string }
            registry: { type: string }
        state:
          type: object
          required: [code, name]
          properties:
            code: { type: integer }
            name: { type: string, enum: [AdminDown, Down, Init, Up] }
        flags:
          type: object
          required: [poll, final, controlPlaneIndependent, authenticationPresent, demand, multipoint]
          properties:
            poll: { type: boolean }
            final: { type: boolean }
            controlPlaneIndependent: { type: boolean }
            authenticationPresent: { type: boolean }
            demand: { type: boolean }
            multipoint: { type: boolean }
        detectMult: { type: integer }
        length: { type: integer }
        myDiscriminator: { type: integer }
        yourDiscriminator: { type: integer }
        desiredMinTxUs: { type: integer }
        requiredMinRxUs: { type: integer }
        requiredMinEchoRxUs: { type: integer }
        auth:
          type: [object, "null"]
          required: [type, name, length]
          properties:
            type: { type: integer }
            name: { type: string }
            length: { type: integer }
        discardedBy: { oneOf: [{ $ref: '#/components/schemas/BfdExplanation' }, { type: "null" }] }
        findings: { type: array, items: { $ref: '#/components/schemas/BfdExplanation' } }

    # ---- rpki-origin-validation (hand-authored 2026-10-19) ---------------------
    RpkiOriginValidationRequest:
      type: object
      required: [route, vrps]
      properties:
        route: { type: string, description: "A prefix and its origin AS (asplain or asdot), or NONE as the origin.", examples: ["192.0.2.0/24 AS64497"] }
        vrps:
          description: One VRP per line (prefix, optional maxLength, AS), or an RFC 8416 SLURM document as text or as a JSON value.
          oneOf:
            - { type: string, examples: ["192.0.2.0/24 AS64496\n192.0.2.0/24 AS64497"] }
            - { type: object, description: "A SLURM file, or an object holding prefixAssertions." }
            - { type: array, description: "An array of prefix assertions (prefix, asn, maxPrefixLength, comment)." }
    RpkiOriginValidationResult:
      type: object
      required: [route, state, vrpFormat, vrpCount, covering, matching, vrps, maxLengthNotes, notes, duplicatesRemoved, slurmFiltersIgnored]
      properties:
        route:
          type: object
          required: [prefix, family, length, origin]
          properties:
            prefix: { type: string, description: "The route prefix, canonical (RFC 5952 for IPv6)." }
            family: { type: string, enum: [ipv4, ipv6] }
            length: { type: integer }
            origin: { description: "The origin AS in asplain, or the string NONE (RFC 6811 section 2).", oneOf: [{ type: integer }, { type: string, const: NONE }] }
            originAsdot: { type: string, description: "The origin in asdot (RFC 5396); absent when the origin is NONE." }
        state: { type: string, enum: [Valid, Invalid, NotFound], description: "The RFC 6811 section 2 validation state." }
        vrpFormat: { type: string, enum: [text, slurm] }
        vrpCount: { type: integer, description: "Distinct VRPs read (duplicates counted once)." }
        covering: { type: integer, description: "VRPs that cover the route prefix." }
        matching: { type: integer, description: "VRPs that match the route." }
        vrps:
          type: array
          items:
            type: object
            required: [index, line, prefix, length, maxLength, maxLengthGiven, asn, covers, relation]
            properties:
              index: { type: integer, description: "1-based position among the distinct VRPs." }
              line: { type: integer, description: "1-based source line (text) or array position (SLURM)." }
              prefix: { type: string }
              length: { type: integer }
              maxLength: { type: integer, description: "Equal to length when none was given." }
              maxLengthGiven: { type: boolean }
              asn: { type: integer }
              comment: { type: string, description: "The SLURM assertion's comment, when present." }
              covers: { type: boolean }
              relation: { type: string, enum: [match, wrong-as, too-specific, wrong-as-and-too-specific, as0, origin-none, not-covering, other-family] }
              viaMaxLength: { type: boolean, description: "On a match only: true when the route is longer than the VRP prefix." }
        maxLengthNotes:
          type: array
          description: VRPs (AS 0 aside) whose maxLength is longer than their prefix (RFC 9319 section 5).
          items:
            type: object
            required: [index, prefix, length, maxLength, asn, authorisedPrefixes, coversRoute]
            properties:
              index: { type: integer }
              prefix: { type: string }
              length: { type: integer }
              maxLength: { type: integer }
              asn: { type: integer }
              authorisedPrefixes: { type: string, description: "2^(maxLength - length + 1) - 1, as a decimal string." }
              coversRoute: { type: boolean }
        notes:
          type: array
          items: { type: string, enum: [origin-none, as0-only, as0-overridden, valid-via-maxlength, duplicates-removed, slurm-filters-not-applied] }
        duplicatesRemoved: { type: integer }
        slurmFiltersIgnored: { type: integer, description: "SLURM prefixFilters present and not applied." }

    # ---- shared ---------------------------------------------------------------
    Error:
      type: object
      description: >
        A structured error. `error` is one of `missing_input` (no input given), `invalid_input` (the engine refused the
        input; `message` is the engine's own text), `not_found`, `method_not_allowed`, or `api_not_served` (the
        processing switch is off). No request input is echoed beyond what is needed to explain the problem.
      required: [error, message]
      properties:
        error:
          type: string
          description: A stable, machine-readable error code.
          examples: ["invalid_input"]
        message:
          type: string
          description: A human-readable explanation.
          examples: ["prefix out of range (0-32): /33"]

    ToolResult:
      type: object
      description: >
        The tool's computed result as a JSON object. The exact fields depend on
        the tool; see the tool's page at https://ronutz.com for the full shape.
        The result is a pure function of the input, so the same input always
        yields the same output.
      additionalProperties: true

    # ---- cidr -----------------------------------------------------------------
    CidrRequest:
      description: The JSON request of /cidr; `mode` selects the mode and defaults to `subnet`.
      oneOf:
        - $ref: '#/components/schemas/CidrSubnetRequest'
        - $ref: '#/components/schemas/CidrVlsmRequest'
        - $ref: '#/components/schemas/CidrSupernetRequest'
        - $ref: '#/components/schemas/CidrOverlapRequest'
    CidrSubnetRequest:
      type: object
      required: [block]
      properties:
        mode: { type: string, const: subnet, description: "Optional: subnet is the default." }
        block: { type: string, description: "An IPv4 CIDR block; host bits are masked off.", examples: ["192.168.1.0/24"] }
    CidrVlsmRequest:
      type: object
      required: [mode, parent, requirements]
      properties:
        mode: { type: string, const: vlsm }
        parent: { type: string, description: "The block to carve; host bits are masked off and reported (`parentMasked`).", examples: ["203.0.113.0/24"] }
        requirements:
          type: array
          minItems: 1
          maxItems: 1024
          description: The subnets to place, in any order (they are placed largest block first).
          items:
            type: object
            required: [hosts]
            properties:
              label: { type: string, description: "An optional name; an empty label is the same as none." }
              hosts: { type: integer, minimum: 1, description: "Usable hosts needed: a whole number, 1 or more (0 is refused as zeroHosts)." }
        pointToPoint31: { type: boolean, default: false, description: "Give a request for exactly 2 hosts a /31 (RFC 3021) instead of a /30." }
    CidrSupernetRequest:
      type: object
      required: [mode, prefixes]
      properties:
        mode: { type: string, const: supernet }
        prefixes: { $ref: '#/components/schemas/CidrPrefixList' }
    CidrOverlapRequest:
      type: object
      required: [mode, prefixes]
      properties:
        mode: { type: string, const: overlap }
        prefixes: { $ref: '#/components/schemas/CidrPrefixList' }
        scope: { type: string, description: "Optional: a block whose uncovered space is listed as gaps.", examples: ["10.0.0.0/24"] }
    CidrPrefixList:
      description: Up to 1,024 IPv4 CIDR blocks, as an array or as one string separated by new lines, commas or spaces.
      oneOf:
        - type: array
          minItems: 1
          maxItems: 1024
          items: { type: string }
        - type: string
    CidrResult:
      type: object
      description: >
        Subnet mode: the breakdown of one IPv4 CIDR block and its special-purpose classification. (Before 2026-10-19
        the operation returned the nine breakdown fields only; `mode` and `specialPurpose` were added then.)
      required: [mode, input, network, broadcast, netmask, wildcard, firstHost, lastHost, totalAddresses, usableHosts, specialPurpose]
      properties:
        mode: { type: string, const: subnet }
        input:
          type: string
          description: The input, trimmed. Host bits are preserved here; see `network` for the masked base address.
          examples: ["192.168.1.0/24"]
        network: { type: string, description: "The network (base) address.", examples: ["192.168.1.0"] }
        broadcast: { type: string, description: "The last address of the block: the directed broadcast for /0 to /30; for a /31 or /32 a host address.", examples: ["192.168.1.255"] }
        netmask: { type: string, description: "The subnet mask in dotted-decimal form.", examples: ["255.255.255.0"] }
        wildcard: { type: string, description: "The inverse (wildcard) mask, as used in ACLs.", examples: ["0.0.0.255"] }
        firstHost: { type: string, description: "The first usable host address.", examples: ["192.168.1.1"] }
        lastHost: { type: string, description: "The last usable host address.", examples: ["192.168.1.254"] }
        totalAddresses: { type: integer, minimum: 1, description: "Total addresses in the block (2 ^ host bits).", examples: [256] }
        usableHosts: { type: integer, minimum: 1, description: "Addresses assignable to hosts: total - 2 for /0 to /30; 2 for a /31 (RFC 3021); 1 for a /32.", examples: [254] }
        specialPurpose: { $ref: '#/components/schemas/CidrSpecialPurposeClassification' }
    CidrSpecialPurposeClassification:
      type: object
      description: >
        The block against the IANA IPv4 Special-Purpose Address Space registry (read 2026-10-19, registry updated
        2025-10-09; its two-block NAT64/DNS64 row split in two) plus 224.0.0.0/4 from the IANA IPv4 Multicast Address
        Space registry: 27 rows. It reports the registry's rows only; it does not check allocation or routing.
      required: [block, totalAddresses, status, matches, specialAddresses]
      properties:
        block: { type: string, description: "The block, host bits masked.", examples: ["192.168.1.0/24"] }
        totalAddresses: { type: integer, description: "Addresses in the block." }
        status:
          type: string
          enum: [special, partial, none]
          description: "special: the whole block lies in a listed range; partial: the block holds one or more listed ranges and other addresses; none: it meets no listed range."
        matches:
          type: array
          description: The ranges holding the block (most specific first), then the ranges it contains (in address order).
          items: { $ref: '#/components/schemas/CidrSpecialPurposeMatch' }
        specialAddresses: { type: integer, description: "Addresses of the block inside any listed range, nested rows counted once." }
    CidrSpecialPurposeMatch:
      type: object
      description: One registry row the block meets, as the registry gives it. A null flag is a cell the registry leaves blank or a column it does not have.
      required: [block, name, rfc, allocated, terminated, source, destination, forwardable, globallyReachable, reservedByProtocol, footnote, registry, relation, overlapAddresses]
      properties:
        block: { type: string, description: "The registry row's block.", examples: ["192.168.0.0/16"] }
        name: { type: string, description: "The registry's Name, verbatim.", examples: ["Private-Use"] }
        rfc: { type: string, description: "The registry's RFC column, verbatim.", examples: ["[RFC 1918]"] }
        allocated: { type: string, description: "Allocation Date, YYYY-MM.", examples: ["1996-02"] }
        terminated: { type: [string, "null"], description: "Termination Date, YYYY-MM; null where the registry says N/A." }
        source: { type: [boolean, "null"], description: "Source: valid as the source address of a datagram that transits two devices." }
        destination: { type: [boolean, "null"], description: "Destination: valid as its destination address." }
        forwardable: { type: [boolean, "null"], description: "Forwardable: a router may forward it between external interfaces." }
        globallyReachable: { type: [boolean, "null"], description: "Globally Reachable: forwardable beyond a specified administrative domain." }
        reservedByProtocol: { type: [boolean, "null"], description: "Reserved-by-Protocol." }
        footnote: { type: [string, "null"], enum: ["1", "2", null], description: "The registry footnote on the row: 1 on Loopback's flags, 2 on 192.0.0.0/24." }
        registry: { type: string, enum: [ipv4-special-purpose, ipv4-multicast], description: "Which IANA registry the row comes from." }
        relation: { type: string, enum: [equal, inside, contains], description: "equal: the same block; inside: the block lies within the row; contains: the block holds the row and more." }
        overlapAddresses: { type: integer, description: "Addresses the block and the row have in common." }
    CidrBlock:
      type: object
      required: [cidr, network, prefix, size]
      properties:
        cidr: { type: string, examples: ["10.0.0.64/26"] }
        network: { type: string, examples: ["10.0.0.64"] }
        prefix: { type: integer, minimum: 0, maximum: 32, examples: [26] }
        size: { type: integer, description: "Addresses in the block.", examples: [64] }
    CidrVlsmResult:
      type: object
      description: VLSM mode.
      required: [mode, parent, parentInput, parentMasked, parentNetwork, parentPrefix, parentSize, subnets, unallocated, usedAddresses, freeAddresses, freeBlocks, placement, utilizationPct]
      properties:
        mode: { type: string, const: vlsm }
        parent: { type: string, description: "The parent, normalised (host bits masked).", examples: ["203.0.113.0/24"] }
        parentInput: { type: string, description: "The parent as typed, trimmed." }
        parentMasked: { type: boolean, description: "True when the typed parent had host bits set and was masked to `parent`." }
        parentNetwork: { type: string }
        parentPrefix: { type: integer }
        parentSize: { type: integer }
        subnets:
          type: array
          description: The allocated blocks, in placement order (largest block first).
          items: { $ref: '#/components/schemas/CidrVlsmSubnet' }
        unallocated:
          type: array
          description: The requests that did not fit, as given.
          items:
            type: object
            properties:
              label: { type: string }
              hosts: { type: integer }
        usedAddresses: { type: integer }
        freeAddresses: { type: integer }
        freeBlocks:
          type: array
          description: The free space left in the parent, as the largest aligned CIDR blocks, in address order.
          items: { $ref: '#/components/schemas/CidrBlock' }
        placement: { type: string, const: largest-first, description: "How the requests were ordered before placement." }
        utilizationPct: { type: number, description: "usedAddresses / parentSize x 100, one decimal place." }
    CidrVlsmSubnet:
      type: object
      required: [label, requestedHosts, prefix, network, netmask, firstHost, lastHost, broadcast, usableHosts, size, pointToPoint31]
      properties:
        label: { type: string, description: "The request's label, or an empty string." }
        requestedHosts: { type: integer }
        prefix: { type: integer }
        network: { type: string }
        netmask: { type: string }
        firstHost: { type: string }
        lastHost: { type: string }
        broadcast: { type: string, description: "The block's last address (a host, not a broadcast, on a /31)." }
        usableHosts: { type: integer }
        size: { type: integer }
        pointToPoint31: { type: boolean, description: "True for a /31 given under the pointToPoint31 option (no network, no broadcast)." }
    CidrSupernetResult:
      type: object
      description: Supernet mode.
      required: [mode, inputCount, inputAddresses, aggregated, aggregatedCount, singleSupernet, supernetExtraAddresses]
      properties:
        mode: { type: string, const: supernet }
        inputCount: { type: integer }
        inputAddresses: { type: integer, description: "Addresses in the union of the inputs (overlaps counted once)." }
        aggregated:
          type: array
          description: The minimal set of aligned blocks covering exactly the union.
          items: { $ref: '#/components/schemas/CidrBlock' }
        aggregatedCount: { type: integer }
        singleSupernet:
          description: The smallest single prefix covering every input.
          oneOf:
            - $ref: '#/components/schemas/CidrBlock'
            - type: "null"
        supernetExtraAddresses: { type: integer, description: "Addresses the single supernet adds beyond the union." }
    CidrOverlapResult:
      type: object
      description: Overlap / gap mode.
      required: [mode, inputCount, overlaps, hasOverlaps, scope, gaps, coveredAddresses, scopeAddresses]
      properties:
        mode: { type: string, const: overlap }
        inputCount: { type: integer }
        overlaps:
          type: array
          items:
            type: object
            required: [a, b, kind, overlapStart, overlapEnd, overlapAddresses]
            properties:
              a: { type: string, description: "The first prefix as given." }
              b: { type: string, description: "The second prefix as given." }
              kind: { type: string, enum: [identical, contains, contained, partial], description: "a is identical to b, a contains b, or a is contained in b. partial cannot occur between two CIDR blocks and is kept for completeness." }
              overlapStart: { type: string }
              overlapEnd: { type: string }
              overlapAddresses: { type: integer }
        hasOverlaps: { type: boolean }
        scope: { type: [string, "null"], description: "The scope, normalised, or null." }
        gaps:
          type: array
          description: Uncovered space inside the scope, or between the lowest and highest prefix when no scope is given.
          items: { $ref: '#/components/schemas/CidrBlock' }
        coveredAddresses: { type: integer, description: "Addresses the prefixes cover (clamped to the scope when one is given)." }
        scopeAddresses: { type: [integer, "null"] }

    # ---- ipv6 -----------------------------------------------------------------
    Ipv6Result:
      type: object
      required: [input, bytes, compressed, expanded, prefixLength, classification, prefix, eui64Mac, teredo, reverseDns]
      properties:
        input: { type: string, description: "The input, trimmed." }
        bytes: { type: array, items: { type: integer, minimum: 0, maximum: 255 }, minItems: 16, maxItems: 16 }
        compressed: { type: string, description: "RFC 5952 canonical form." }
        expanded: { type: string, description: "Eight groups of four hex digits." }
        prefixLength: { type: [integer, "null"] }
        classification: { $ref: '#/components/schemas/Ipv6Classification' }
        prefix:
          description: Prefix arithmetic, when a prefix length was given.
          oneOf:
            - $ref: '#/components/schemas/Ipv6PrefixMath'
            - type: "null"
        eui64Mac: { type: [string, "null"], description: "The MAC inside a modified EUI-64 interface identifier (ff:fe in the middle), else null." }
        teredo:
          description: The Teredo fields of a single 2001::/32 address (no prefix, or /128), else null.
          oneOf:
            - $ref: '#/components/schemas/Ipv6Teredo'
            - type: "null"
        reverseDns: { type: string, description: "The ip6.arpa name." }
    Ipv6Classification:
      type: object
      required: [type, detail, isMulticast]
      properties:
        type: { type: string, description: "The special-use type, e.g. Global unicast, Documentation, Teredo, Multicast, Source-specific multicast.", examples: ["Documentation"] }
        detail: { type: string, description: "The matching prefix.", examples: ["2001:db8::/32"] }
        scope: { type: string, description: "Multicast or link-local scope name, e.g. global, link-local, \"reserved (scope F)\", \"unassigned (scope 6)\"." }
        isMulticast: { type: boolean }
        embeddedIpv4: { type: string, description: "The dotted IPv4 tail of an IPv4-mapped or IPv4-compatible address." }
        scopeStatus: { type: string, enum: [assigned, reserved, unassigned], description: "Multicast only: the status of the 4-bit scope value." }
        flags: { type: string, description: "Multicast only: the flag nibble read bit by bit.", examples: ["0011 (X=0, R=0, P=1, T=1)"] }
        ssmRange: { type: string, description: "Source-specific multicast only: the group-ID range the address falls in." }
    Ipv6PrefixMath:
      type: object
      required: [prefixLength, hostBits, network, firstAddress, lastAddress, countPow2, countExact]
      properties:
        prefixLength: { type: integer }
        hostBits: { type: integer }
        network: { type: string }
        firstAddress: { type: string }
        lastAddress: { type: string }
        countPow2: { type: string, examples: ["2^64"] }
        countExact: { type: string, description: "The exact address count as a decimal string.", examples: ["18446744073709551616"] }
    Ipv6Teredo:
      type: object
      description: RFC 4380 section 4, flags as updated by RFC 5991 section 3.1.
      required: [server, flags, cone, port, client]
      properties:
        server: { type: string, description: "The Teredo server's IPv4 address (bits 32 to 63)." }
        flags: { type: string, description: "The 16-bit Flags field in hex with C, U and G read out.", examples: ["0x3c5a (C=0, U=0, G=0)"] }
        cone: { type: boolean, description: "The cone bit C." }
        port: { type: integer, description: "The client's mapped UDP port (bits 80 to 95 XOR 0xffff)." }
        client: { type: string, description: "The client's mapped IPv4 address (bits 96 to 127 XOR 0xffffffff)." }

    # ---- oui-lookup -----------------------------------------------------------
    OuiResult:
      type: object
      required: [ok, input]
      properties:
        ok: { type: boolean, description: "False when the input is not a MAC or an OUI; then only input and error are present." }
        input: { type: string }
        hex: { type: string, description: "Normalised hex (6, 12 or 16 digits), upper case." }
        formatted: { type: string, description: "Colon-separated form." }
        oui: { type: string, description: "The 24-bit OUI as 6 hex digits." }
        ouiFormatted: { type: string }
        vendor: { type: [string, "null"], description: "The IEEE MA-L registrant, or null when none applies (multicast, locally administered, or not in the snapshot)." }
        multicast: { type: boolean, description: "The I/G bit." }
        local: { type: boolean, description: "The U/L bit: true when locally administered." }
        isOuiOnly: { type: boolean, description: "The input was a bare OUI." }
        notes: { type: array, items: { type: string }, description: "Explanatory notes, in English." }
        wellKnown: { $ref: '#/components/schemas/OuiWellKnown' }
        error:
          type: object
          properties:
            message: { type: string }
    OuiWellKnown:
      type: object
      description: A meaning set by a standard or registry rather than by the OUI holder.
      required: [kind, name, standard]
      properties:
        kind: { type: string, enum: [ipv4-multicast, ipv6-multicast, vrrp-ipv4, vrrp-ipv6, iana-block, group-address] }
        name: { type: string, description: "The registry's or standard's own name, in English." }
        standard: { type: string, description: "Where the value is defined." }
        vrid: { type: integer, description: "VRRP only: the Virtual Router Identifier (the last octet); 0 is reported with a note, outside the 1 to 255 RFC 9568 defines." }
        ipv4Groups: { type: array, items: { type: string }, minItems: 32, maxItems: 32, description: "IPv4 multicast only: the 32 groups that map to this MAC." }
        ipv6Low32: { type: string, description: "IPv6 multicast only: the group address's last 32 bits, as two hex groups.", examples: ["ff12:3456"] }
        bridgeFiltered: { type: boolean, description: "IEEE 802.1Q reserved block only: not relayed by bridges." }

    # ---- mtu-mss --------------------------------------------------------------
    MtuMssResult:
      type: object
      required: [mtu, outer, layers, encapTotal, labelTotal, shimTotal, innerMtu, mssV4, mssV6, frame, efficiency, innerIsV6Only, hasVariableLayer]
      properties:
        mtu: { type: integer, description: "The link IP MTU as given." }
        outer: { type: string, enum: [ipv4, ipv6], description: "The outer IP version used to size IP-carrying encapsulations." }
        layers:
          type: array
          description: The resolved stack, in the order given.
          items:
            type: object
            required: [id, bytes, kind]
            properties:
              id: { type: string, examples: ["vxlan"] }
              bytes: { type: integer }
              kind: { type: string, enum: [encap, label, shim], description: "encap and label spend bytes inside the MTU; shim grows the frame." }
              variable: { type: boolean, description: "The size is a documented base that options can exceed (GENEVE)." }
        encapTotal: { type: integer, description: "Encapsulation bytes." }
        labelTotal: { type: integer, description: "MPLS label stack bytes, 4 per entry; 0 without an mpls token." }
        shimTotal: { type: integer, description: "802.1Q and QinQ tag bytes only." }
        innerMtu: { type: integer, description: "mtu - encapTotal - labelTotal." }
        mssV4: { type: integer, description: "innerMtu - 20 (IPv4) - 20 (TCP)." }
        mssV6: { type: integer, description: "innerMtu - 40 (IPv6) - 20 (TCP)." }
        frame:
          type: object
          required: [l2Header, shimBytes, fcs, maxFrame, onWire]
          properties:
            l2Header: { type: integer, const: 14 }
            shimBytes: { type: integer, description: "802.1Q and QinQ bytes in the header." }
            fcs: { type: integer, const: 4 }
            maxFrame: { type: integer, description: "mtu + 14 + shimBytes + 4." }
            onWire: { type: integer, description: "maxFrame + 8 (preamble and SFD) + 12 (inter-frame gap)." }
        efficiency:
          type: object
          description: Wire efficiency of a full-sized TCP/IPv4 segment, (MTU - 40) / (MTU + 38), in percent.
          required: [atMtu, ref1500, ref9000]
          properties:
            atMtu: { $ref: '#/components/schemas/MtuEfficiencyRow' }
            ref1500: { $ref: '#/components/schemas/MtuEfficiencyRow' }
            ref9000: { $ref: '#/components/schemas/MtuEfficiencyRow' }
        underlay:
          type: object
          description: Present when the stack has an encapsulation or an MPLS label.
          required: [innerTarget, requiredMtu, requiredFrame]
          properties:
            innerTarget: { type: integer, const: 1500 }
            requiredMtu: { type: integer, description: "1500 + encapTotal + labelTotal." }
            requiredFrame: { type: integer, description: "The frame that MTU implies, with this stack's tags." }
        innerIsV6Only: { type: boolean, description: "True when the stack includes 6in4." }
        hasVariableLayer: { type: boolean }
    MtuEfficiencyRow:
      type: object
      required: [mtu, percent]
      properties:
        mtu: { type: integer }
        percent: { type: number }

    # ---- dig-output-explainer -------------------------------------------------
    DigOutputParse:
      type: object
      required: [sections, footer, warnings, hadHeader]
      properties:
        versionLine: { type: string, description: "The `; <<>> DiG ... <<>>` line, verbatim." }
        digVersion: { type: string, examples: ["9.20.29"] }
        queryArgs: { type: string, description: "The arguments after `<<>>`." }
        header:
          type: object
          required: [opcode, status, id]
          properties:
            opcode: { type: string, description: "As dig printed it (QUERY, NOTIFY, UPDATE, RESERVED6, ...)." }
            status: { type: string, description: "The RCODE as dig printed it (NOERROR, NXDOMAIN, RESERVED11, ...)." }
            id: { type: string, description: "The transaction id, as printed." }
            opcodeName: { type: string, description: "The IANA name where dig prints a placeholder: RESERVED6 is DSO (RFC 8490)." }
            statusName: { type: string, description: "The IANA name where dig prints a placeholder: RESERVED11 is DSOTYPENI (RFC 8490)." }
        flags:
          type: object
          required: [flags, counts]
          properties:
            flags: { type: array, items: { type: string, enum: [qr, aa, tc, rd, ra, ad, cd] } }
            counts:
              type: object
              required: [question, answer, authority, additional]
              properties:
                question: { type: integer }
                answer: { type: integer }
                authority: { type: integer }
                additional: { type: integer }
        opt:
          type: object
          description: The EDNS OPT pseudo-section.
          required: [version, flags, udp, extra]
          properties:
            version: { type: string }
            flags: { type: string, description: "e.g. do, or empty." }
            udp: { type: [integer, "null"], description: "The advertised UDP payload size." }
            extra: { type: array, items: { type: string }, description: "Further OPT lines (COOKIE, NSID, EDE, ...), verbatim." }
        sections:
          type: array
          items:
            type: object
            required: [name, records]
            properties:
              name: { type: string, enum: [QUESTION, ANSWER, AUTHORITY, ADDITIONAL] }
              records: { type: array, items: { $ref: '#/components/schemas/DigRecord' } }
        footer:
          type: object
          properties:
            queryTime: { type: string }
            server: { type: string }
            when: { type: string }
            msgSize: { type: string }
        negative:
          type: object
          description: For a negative answer with an SOA in AUTHORITY, the negative-caching TTL (RFC 2308 section 5).
          required: [owner, soaTtl, minimum, ttl]
          properties:
            owner: { type: string, description: "The SOA's owner name." }
            soaTtl: { type: integer, description: "The TTL on the SOA line, in seconds." }
            minimum: { type: integer, description: "The SOA's MINIMUM field, in seconds." }
            ttl: { type: integer, description: "The smaller of the two." }
        warnings:
          type: array
          description: Stable codes.
          items: { type: string, enum: [nonzero-rcode, truncated-tc, noerror-nodata, looks-like-query, dnssec-requested-not-validated, ttl-units, ttl-absent] }
        hadHeader: { type: boolean, description: "False when the text is almost certainly not dig output." }
    DigRecord:
      type: object
      required: [name, ttl, class, type, rdata, isQuestion]
      properties:
        name: { type: string }
        ttl: { type: [integer, "null"], description: "In seconds; null for a question and for a record printed without a TTL (+nottlid)." }
        ttlText: { type: string, description: "The TTL as printed, kept only when dig printed it in units (+ttlunits)." }
        class: { type: string, description: "IN, CH, HS, ...; empty when dig printed no class." }
        type: { type: string }
        rdata: { type: string, description: "The record data on one line (+multiline records joined); empty for a question." }
        isQuestion: { type: boolean }

    # ---- nslookup-output-explainer --------------------------------------------
    NslookupParse:
      type: object
      required: [authority, records, errors, referralNote, warnings, recognized]
      properties:
        server:
          type: object
          required: [server, address]
          properties:
            server: { type: string }
            address: { type: string, examples: ["8.8.8.8#53"] }
        authority: { type: string, enum: [authoritative, non-authoritative, unknown] }
        records:
          type: array
          items:
            type: object
            required: [name, type, value]
            properties:
              name: { type: string }
              type: { type: string, description: "A, AAAA, MX, NS, CNAME, TXT, PTR, SRV or SOA." }
              value: { type: string, description: "The value as printed." }
              fields:
                type: array
                description: MX, SRV and SOA values in labelled fields.
                items:
                  type: object
                  required: [label, value]
                  properties:
                    label: { type: string }
                    value: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [name, code]
            properties:
              name: { type: string }
              code: { type: string, description: "NXDOMAIN, SERVFAIL, REFUSED, timed out, ..." }
        referralNote: { type: boolean, description: "\"Authoritative answers can be found from:\" was present." }
        warnings:
          type: array
          description: Stable codes.
          items: { type: string, enum: [nxdomain, servfail, refused, no-servers, non-authoritative] }
        recognized: { type: boolean, description: "False when the text is almost certainly not nslookup output." }

    # ---- dig-command-builder --------------------------------------------------
    DigCommandRequest:
      type: object
      description: Every field is optional; a name (or `reverse`) is needed for a command.
      properties:
        name: { type: string, description: "The owner name.", examples: ["example.com"] }
        type: { type: string, description: "A mnemonic from the IANA registry, TYPEnn, ANY, AXFR or IXFR. Default A." }
        ixfrSerial: { type: string, description: "For IXFR: the client's SOA serial (written ixfr=N)." }
        klass: { type: string, enum: [IN, CH, HS], description: "Default IN." }
        reverse: { type: string, description: "-x: an IPv4 or IPv6 address; name, type and class are then not needed." }
        server: { type: string, description: "@server: a host name or an address; empty means the resolvers in /etc/resolv.conf." }
        port: { type: string, description: "-p; empty means the transport's default (53, 853 for TLS, 443 for HTTPS)." }
        ipv: { type: string, enum: ["", "4", "6"], description: "-4 or -6." }
        source: { type: string, description: "-b address[#port]." }
        transport: { type: string, enum: [udp, tcp, tls, https], description: "Default udp." }
        httpsEndpoint: { type: string, description: "+https=/path; empty means /dns-query." }
        trace: { type: boolean }
        nssearch: { type: boolean }
        norecurse: { type: boolean }
        dnssec: { type: boolean }
        cd: { type: boolean }
        noedns: { type: boolean }
        bufsize: { type: string, description: "+bufsize=B, 0 to 65535. 0 advertises a 0-byte buffer (a warning)." }
        nocookie: { type: boolean }
        nsid: { type: boolean }
        subnet: { type: string, description: "+subnet=addr[/prefix], or 0." }
        ignore: { type: boolean }
        timeout: { type: string }
        tries: { type: string }
        retry: { type: string }
        output: { type: string, enum: [full, short, answer, yaml], description: "Default full." }
        identify: { type: boolean }
        multiline: { type: boolean }
        ttlunits: { type: boolean }
        qr: { type: boolean }
        keyfile: { type: string, description: "-k keyfile." }
        norc: { type: boolean, description: "-r: do not read ${HOME}/.digrc." }
    DigCommandResult:
      type: object
      required: [ok, command, parts, findings, effective]
      properties:
        ok: { type: boolean, description: "False when an error finding stops the build." }
        command: { type: string, description: "The command on one line; empty when ok is false." }
        parts:
          type: array
          items:
            type: object
            required: [text, kind, explain]
            properties:
              text: { type: string }
              kind: { type: string, enum: [program, server, option, name, type, class, queryopt] }
              explain: { type: string, description: "The id of the explanation (tools.dig-command-builder.explain.<id> on the page)." }
        findings:
          type: array
          description: Errors first, then warnings, then infos.
          items:
            type: object
            required: [code, severity]
            properties:
              code: { type: string, examples: ["bufsize-default"] }
              severity: { type: string, enum: [error, warning, info] }
              params: { type: object, additionalProperties: { type: string } }
        effective:
          description: What the query will carry; null when ok is false.
          oneOf:
            - type: "null"
            - type: object
              required: [question, servers, transport, tcpFallback, port, recursionDesired, iterative, dnssecOk, checkingDisabled, authenticData, edns, bufsize, cookie, signed]
              properties:
                question:
                  type: object
                  required: [name, type, klass]
                  properties:
                    name: { type: string }
                    type: { type: string }
                    klass: { type: string }
                servers: { type: string, enum: [given, resolv-conf] }
                transport: { type: string, enum: [UDP, TCP, TLS, HTTPS] }
                tcpFallback: { type: boolean }
                port: { type: integer }
                recursionDesired: { type: boolean }
                iterative: { type: boolean }
                dnssecOk: { type: boolean }
                checkingDisabled: { type: boolean }
                authenticData: { type: boolean }
                edns: { type: boolean }
                bufsize: { type: [integer, "null"], description: "The advertised size, or null for dig's default." }
                cookie: { type: boolean }
                signed: { type: boolean }

    # ---- dhcp-option-43 -------------------------------------------------------
    DhcpOption43Request:
      type: object
      required: [vendor, addresses]
      properties:
        vendor: { type: string, enum: [cisco-wlc, ruckus-zonedirector, ruckus-smartzone, unifi-ip, extreme-wireless, extreme-cloudiq-switch, aruba, fortiap] }
        addresses: { type: string, description: "One or more controller IPv4 addresses, separated by spaces, commas or semicolons.", examples: ["192.168.10.5 192.168.10.20"] }
    DhcpOption43Result:
      type: object
      required: [vendor, addresses, option, encoding, serverSnippets, notes]
      properties:
        vendor:
          type: object
          description: The vendor profile the value was built from.
          required: [id, label, encoding, multiple, source]
          properties:
            id: { type: string }
            label: { type: string }
            encoding: { type: string, enum: [hex, string, other-option] }
            subOption: { type: integer, description: "The sub-option code, where the vendor defines one." }
            addressForm: { type: string, enum: [binary, ascii, ascii-list], description: "binary: four bytes per address; ascii: one address as text; ascii-list: the addresses as one text joined by \", \"." }
            multiple: { type: boolean, description: "Accepts more than one controller address." }
            vendorClass: { type: string, description: "The option 60 vendor class the vendor requires." }
            useOption: { type: integer, description: "The option to use instead, for encoding other-option." }
            source:
              type: object
              required: [label, url]
              properties:
                label: { type: string }
                url: { type: string }
                access_date: { type: string, description: "The day the page was last read and checked." }
                unreachable: { type: string, description: "Why it could not be re-read, with the date." }
        addresses: { type: array, items: { type: string } }
        option: { type: integer, description: "43, or 138 for FortiAP." }
        encoding: { type: string, enum: [hex, string, other-option] }
        hex: { type: string, description: "The value in lower-case hex, for encoding hex." }
        text: { type: string, description: "The value as text, for encoding string or other-option." }
        breakdown:
          type: array
          description: How a hex value was built, byte group by byte group.
          items:
            type: object
            required: [bytes, meaning]
            properties:
              bytes: { type: string }
              meaning: { type: string }
        serverSnippets:
          type: array
          items:
            type: object
            required: [server, lines]
            properties:
              server: { type: string, enum: [isc-dhcp, cisco-ios, windows, mikrotik] }
              lines: { type: array, items: { type: string } }
        notes:
          type: array
          description: Stable codes.
          items: { type: string, enum: [vendor-class-required, not-option-43, string-not-hex, ascii-not-binary, multiple-controllers] }

    # ---- ssrf-url-classifier --------------------------------------------------
    SsrfResult:
      type: object
      required: [input, scheme, host, port, path, isIp, ipVersion, canonicalIp, obfuscated, obfuscationForm, category, risk, reasons, schemeFlag, hasUserinfo, embedding, embeddedIpv4, embeddingLayout, specialBlock, embeddedSpecialBlock, teredo, anycastService]
      properties:
        input: { type: string, description: "The input as given." }
        scheme: { type: [string, "null"], description: "The URL scheme, best effort." }
        host: { type: [string, "null"], description: "The host as written (brackets removed from an IPv6 literal)." }
        port: { type: [string, "null"] }
        path: { type: [string, "null"] }
        isIp: { type: boolean, description: "The host is, or decodes to, an IP address." }
        ipVersion: { type: [integer, "null"], enum: [4, 6, null] }
        canonicalIp: { type: [string, "null"], description: "Dotted IPv4, or RFC 5952 IPv6 text (mixed notation for the IPv4-mapped, IPv4-compatible and NAT64 Well-Known Prefix forms)." }
        obfuscated: { type: boolean, description: "The host was an inet_aton spelling of an IPv4 address other than plain dotted decimal." }
        obfuscationForm: { type: [string, "null"], enum: [decimal, octal, hex, short, null] }
        category: { type: string, enum: [loopback, private, link-local, cloud-metadata, cgnat, reserved, public, internal-name, unresolved] }
        risk: { type: string, enum: [high, medium, low, unknown] }
        reasons: { type: array, items: { type: string }, description: "Why, in English sentences, quoting the registry row and the RFCs." }
        schemeFlag: { type: [string, "null"], enum: [file, gopher, dict, ftp, ldap, tftp, sftp, netdoc, jar, null], description: "A non-HTTP scheme that escalates SSRF." }
        hasUserinfo: { type: boolean, description: "Credentials are embedded (user:pass@host)." }
        embedding:
          type: [string, "null"]
          enum: [ipv4-mapped, nat64-wkp, nat64-local, 6to4, ipv4-compatible, teredo, null]
          description: The IPv4-in-IPv6 layout decoded, if any.
        embeddedIpv4: { type: [string, "null"], description: "The carried IPv4 address that decides the rating (for Teredo, the more internal of server and client)." }
        embeddingLayout: { type: [integer, "null"], description: "The RFC 6052 prefix length whose layout produced embeddedIpv4 (NAT64 only): 96 for 64:ff9b::/96; 48, 56, 64 or 96 for 64:ff9b:1::/48." }
        specialBlock:
          description: The IANA special-purpose registry row the address falls in (most specific), or null.
          oneOf:
            - $ref: '#/components/schemas/SsrfSpecialBlock'
            - type: "null"
        embeddedSpecialBlock:
          description: The IANA IPv4 registry row of the carried address, for an IPv4-in-IPv6 host, or null.
          oneOf:
            - $ref: '#/components/schemas/SsrfSpecialBlock'
            - type: "null"
        teredo:
          description: The decoded Teredo fields, when embedding is teredo; else null.
          oneOf:
            - type: "null"
            - type: object
              required: [serverIpv4, clientIpv4, clientPort, flags]
              properties:
                serverIpv4: { type: string, description: "Bits 32 to 63, the Teredo server, as stored." }
                clientIpv4: { type: string, description: "Bits 96 to 127 XOR 0xFFFFFFFF: the client's mapped IPv4 address." }
                clientPort: { type: integer, description: "Bits 80 to 95 XOR 0xFFFF: the client's mapped UDP port." }
                flags: { type: integer, description: "Bits 64 to 79, the 16-bit Flags field (RFC 4380, RFC 5991)." }
        anycastService: { type: boolean, description: "The deciding address is a registry anycast service address (PCP, TURN, DNS-SD SRP, 6a44 relay)." }
    SsrfSpecialBlock:
      type: object
      description: One row of the IANA IPv4 or IPv6 Special-Purpose Address Space registry, as IANA writes it.
      required: [prefix, name, rfc, globallyReachable]
      properties:
        prefix: { type: string, examples: ["127.0.0.0/8"] }
        name: { type: string, examples: ["Loopback"] }
        rfc: { type: string, examples: ["RFC 1122, Section 3.2.1.3"] }
        globallyReachable: { type: [boolean, "null"], description: "The Globally Reachable column; null where the registry gives none (192.88.99.0/24, 2001:10::/28, 2001::/32, 2002::/16)." }
