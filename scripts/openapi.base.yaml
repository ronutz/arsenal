        description: "Tool documentation: IPv6 Toolkit"
        url: https://ronutz.com/en/tools/ipv6/docs
      parameters:
        - name: input
          in: query
          required: true
          description: An IPv6 address, or an address with a prefix length (0 to 128).
          schema:
            type: string
            examples: ["2001:db8::/64"]
