  /ipv6:
    get:
      tags: [Networking & addressing]
      operationId: run_ipv6
      summary: IPv6 Toolkit
      description: &ipv6Description |
        Parses one IPv6 address or prefix (RFC 4291 text forms) and returns its RFC 5952 compressed and fully expanded
        forms, the 16 bytes, the special-use classification, the prefix arithmetic when a `/length` is given, a
        modified EUI-64 MAC when the interface identifier carries ff:fe, a Teredo decode for a single 2001::/32
        address, and the ip6.arpa reverse-DNS name.

        For a multicast address (ff00::/8) the classification also gives the scope name and whether the 4-bit scope
        value is assigned, reserved or unassigned (RFC 7346 and the IANA scope registry), the four flag bits read out
        (RFC 4291 section 2.7, RFC 7371 section 4), and for ff3x::/32 the source-specific multicast group-ID range
        (RFC 4607, IANA registry). A malformed input is refused with HTTP 400 and the message `empty`, `format` or
        `prefix`.
